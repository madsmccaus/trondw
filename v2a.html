<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Trond Worren</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="/lib/sanitize.js"></script><script src="/shell.js"></script><script src="/v2.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:'Noto Serif',Georgia,serif}
a{color:inherit}.sans{font-family:'Noto Sans',sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 48px}
header{padding:96px 0 72px;border-bottom:1px solid #e6e6e6}
.name{font-size:clamp(3rem,8vw,6.5rem);font-weight:400;letter-spacing:-.02em;line-height:1;margin:0;text-decoration:none;display:block}
.tag{font-family:'Noto Sans',sans-serif;font-size:1rem;color:#777;margin:20px 0 0}
nav{margin-top:36px;display:flex;gap:28px;font-family:'Noto Sans',sans-serif;font-size:.95rem}
nav a{text-decoration:none;color:#555}nav a:hover{color:#000}
.entry{display:grid;grid-template-columns:180px 1fr;gap:48px;padding:72px 0;border-bottom:1px solid #eee}
.date{font-family:'Noto Sans',sans-serif;font-size:.9rem;color:#888;padding-top:.55em}
.title{font-size:2.25rem;line-height:1.2;font-weight:400;margin:0 0 24px;max-width:22ch}
.title a{text-decoration:none}.title a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.text{font-size:1.2rem;line-height:1.8;max-width:36em;color:#333}.text p{margin:0 0 1.2em}
.more{font-family:'Noto Sans',sans-serif;font-size:.95rem;color:#222;text-underline-offset:4px}
.arch{padding:80px 0 120px;display:grid;grid-template-columns:180px 1fr;gap:48px}
.arch a{font-size:1.75rem;text-decoration:none;border-bottom:1px solid #222}
.arch p{font-family:'Noto Sans',sans-serif;color:#777;font-size:1rem;margin:12px 0 0}
.back{font-family:'Noto Sans',sans-serif;font-size:.95rem;color:#555;text-decoration:none;display:inline-block;margin:56px 0 0}
.sample{display:inline-block;font-family:'Noto Sans',sans-serif;font-size:.85rem;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:999px;padding:2px 10px;margin-bottom:16px}
.empty{padding:72px 0;font-family:'Noto Sans',sans-serif;color:#777}
@media(max-width:760px){.wrap{padding:0 24px}header{padding:56px 0 40px}.entry,.arch{grid-template-columns:1fr;gap:12px;padding:48px 0}.title{font-size:1.75rem}.text{font-size:1.0625rem}}
</style></head><body><div class="wrap">
<header><a class="name" href="/v2a">Trond Worren</a><p class="tag">Tidligere tigger, uteligger.</p>
<nav><a href="/v2a">Forside</a><a href="/arkiv">Arkiv</a></nav></header>
<main id="root"></main></div>
<script>
twV2({
  list: (ps) => ps.map((p) => `<article class="entry"><div class="date">${TW.date(p.d)}</div><div>${twSample(p)}
    <h2 class="title"><a href="${twLink(p)}">${TW.esc(p.t)}</a></h2>
    <div class="text"><p>${TW.esc(TW.preview(p.x, 380))}</p></div><a class="more" href="${twLink(p)}">Les videre</a></div></article>`).join('')
    + `<section class="arch"><div class="date">2016–2022</div><div><a href="/arkiv">Gå til arkivet →</a><p>4 486 innlegg og håndskrevne dagbøker.</p></div></section>`,
  post: (p) => `<a class="back" href="/v2a">← Tilbake til forsiden</a><article class="entry" style="border:0"><div class="date">${TW.date(p.d)}</div><div>${twSample(p)}
    <h1 class="title">${TW.esc(p.t)}</h1><div class="text">${TW.paras(p.x)}</div>
    <a class="more" href="/v2a">← Tilbake til forsiden</a></div></article>`
});
</script></body></html>
