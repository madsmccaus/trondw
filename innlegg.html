<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innlegg · Trond Worren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/classic.css">
<script src="/lib/sanitize.js"></script>
<script src="/shell.js"></script>
</head>
<body>
<div class="site">
<aside class="sidebar"><div class="sidebar-inner">
  <a class="site-title" href="/">Trond Worren</a>
  <p class="site-desc">Tidligere tigger, uteligger.</p>
  <nav aria-label="Hovedmeny"><ul class="nav">
    <li><a href="/" >Siste innlegg</a></li>
    <li><a href="/arkiv">Arkiv</a></li>
  </ul></nav>
  <div class="widget">
    <h2 class="widget-title">Arkivet</h2>
    <p>4 486 innlegg og håndskrevne dagbøker fra 2016 til 2022, bevart fra trondworren.net.</p>
    <a class="btn" href="/arkiv">Åpne arkivet →</a>
  </div>
</div></aside>
<main class="main"><div class="main-inner">
  <a class="back" href="/">← Tilbake til forsiden</a>
  <div id="post"><p class="empty">Laster…</p></div>
  <a class="back" href="/">← Tilbake til forsiden</a>
</div></main>
</div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const m = q.get('m') || '', i = q.get('i') || '';
  const el = document.getElementById('post');
  let p = (await TW.latest()).find((x) => x.m === m && String(x.i) === i);
  if (!p && /^\d{4}-\d{2}$/.test(m)) {
    try {
      const month = await fetch(`/data/${m}.json`).then((r) => r.json());
      const hit = month.find((x) => String(x.i) === i && x.src === 'email');
      if (hit) p = { ...hit, m };
    } catch (e) {}
  }
  if (!p) { el.innerHTML = '<p class="empty">Fant ikke innlegget.</p>'; return; }
  p = TW.clean(p);
  document.title = `${p.t} · Trond Worren`;
  el.innerHTML = `
    <article class="card">
      <div class="card-body">
        ${p.sample ? '<span class="badge sample">Eksempel · kun forhåndsvisning</span>' : ''}
        <h1 class="entry-title">${TW.esc(p.t)}</h1>
        <div class="entry-text">${TW.paras(p.x)}</div>
      </div>
      <footer class="card-footer"><span>${TW.date(p.d)}</span><span>${TW.esc(TW.CL[p.c] || 'Annet')}</span></footer>
    </article>`;
})();
</script>
</body>
</html>
