<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkiv · Trond Worren</title>
<link rel="preload" href="/fonts/EBGaramond-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'EB Garamond';src:url('/fonts/EBGaramond-var.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:'EB Garamond';src:url('/fonts/EBGaramond-Italic-var.woff2') format('woff2');font-weight:400 700;font-style:italic;font-display:swap}
:root{
  --paper:#f6f1e8; --ink:#1c1915; --mute:#5a5248; --accent:#8c3d16; --sheet:#fffdf8;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:18px;-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.55}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.page{max-width:76rem;margin:0 auto;padding:0 2rem}
header{display:flex;flex-direction:column;align-items:center;gap:.9rem;padding:2.75rem 0 0;text-align:center}
.mast{font-size:1.6rem;font-weight:500;line-height:1.1}
nav{display:flex;gap:1.5rem;font-family:var(--sans);font-size:.9rem;font-weight:500}
nav a{border-bottom:1px solid transparent;padding-bottom:1px}
nav a:hover,nav a[aria-current="page"]{border-bottom-color:var(--ink)}
/* feature */
.feature{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2rem;margin:3.5rem auto 5.5rem;max-width:44rem}
.feature .cover{display:block;width:min(30rem,100%);aspect-ratio:var(--ar,0.707);background:var(--sheet);box-shadow:0 .5px 1px rgba(28,25,21,.05),0 2px 4px rgba(28,25,21,.035),0 8px 18px rgba(28,25,21,.04),0 22px 44px rgba(28,25,21,.035);border:0;padding:0;cursor:pointer;overflow:hidden;transition:transform .3s ease,box-shadow .3s ease}
.feature .cover:hover,.feature .cover:focus-visible{transform:translateY(-4px);box-shadow:0 1px 2px rgba(28,25,21,.05),0 4px 8px rgba(28,25,21,.04),0 14px 28px rgba(28,25,21,.05),0 32px 60px rgba(28,25,21,.04)}
.feature .cover:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.feature .cover img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .25s ease}
.feature .meta{max-width:36rem}
.feature .date{font-family:var(--sans);font-size:.9rem;font-weight:500;color:var(--mute);margin:0 0 .6rem}
.feature h2{font-size:clamp(1.7rem,3vw,2.2rem);font-weight:500;line-height:1.2;margin:0 0 2rem;text-wrap:balance}
.actions{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:.5rem;height:2.6rem;padding:0 1.1rem;border-radius:6px;font-family:var(--sans);font-size:.9rem;font-weight:500;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;transition:background .15s,color .15s}
.btn:hover{background:#3a332b;border-color:#3a332b}
.btn.ghost{background:transparent;color:var(--ink);border-color:rgba(28,25,21,.35)}
.btn.ghost:hover{background:rgba(28,25,21,.06)}
/* browse */
.browse-head{display:flex;justify-content:center;margin:0 0 2rem}
.years{display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem;font-family:var(--sans);font-size:.9rem;font-weight:500}
.years button{font:inherit;color:var(--ink);background:none;border:0;border-radius:6px;padding:.4rem .65rem;cursor:pointer}
.years button:hover{background:rgba(28,25,21,.06)}
.years button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grid{list-style:none;margin:0 auto;padding:0;max-width:72rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:2.25rem 1.75rem}
.grid li{margin:0}
.grid button{display:block;width:100%;border:0;padding:0;background:none;text-align:left;cursor:pointer;color:inherit}
.grid button:focus-visible{outline:none}
.grid button:focus-visible .thumb{outline:2px solid var(--ink);outline-offset:4px}
.thumb{display:block;width:100%;aspect-ratio:1/1.414;background:var(--sheet);box-shadow:0 .5px 1px rgba(28,25,21,.05),0 2px 4px rgba(28,25,21,.035),0 8px 18px rgba(28,25,21,.04),0 22px 44px rgba(28,25,21,.035);overflow:hidden;transition:transform .25s ease,box-shadow .25s ease}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
.grid button:hover .thumb,.grid button:focus-visible .thumb{transform:translateY(-3px);box-shadow:0 1px 2px rgba(28,25,21,.05),0 4px 8px rgba(28,25,21,.04),0 14px 28px rgba(28,25,21,.05),0 32px 60px rgba(28,25,21,.04)}
.cap{display:block;text-align:center;margin-top:.6rem;font-family:var(--sans);font-size:.85rem;font-weight:500;color:var(--mute)}
.more{display:flex;justify-content:center;margin:3rem 0 0}
.count{font-family:var(--sans);font-size:.9rem;color:var(--mute);margin:1rem 0 0;text-align:center}
footer.site{text-align:center;padding:5rem 0 3rem;font-family:var(--sans);font-size:.85rem;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* card entrance */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.grid li.in{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 35ms)}
.feature.in .cover{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.feature.in .meta{animation:rise .7s .08s cubic-bezier(.2,.8,.2,1) both}
/* reader: the document itself travels from its card to the centre of the screen */
.rd{position:fixed;inset:0;z-index:50;visibility:hidden}
.rd.on{visibility:visible}
html{scrollbar-gutter:stable}
html.rd-lock{overflow:hidden}
.rd-bg,.rd-meta,.rd-close{opacity:0}
.rd-bg{position:absolute;inset:0;background:var(--paper);opacity:0}
.rd-close{position:absolute;top:1rem;right:1.25rem;z-index:5;opacity:0}
.fb-stage{position:absolute;inset:0;perspective:3400px;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.fb-fly{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.fb-book{position:absolute;width:calc(var(--pw) * var(--cols));height:var(--ph);transform-style:preserve-3d;pointer-events:auto;cursor:pointer;transform:translateX(var(--shift,0px));transition:transform .75s var(--spring)}
.fb-pg,.fb-sheet,.fb-stack i{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--sheet)}
.fb-pg{overflow:hidden;box-shadow:var(--paper-shadow)}
.fb-pg.l{left:0}.fb-pg.r{right:0}.fb-pg.c{left:0}
.fb-pg.blank{display:none}
.fb-pg img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
/* soft, layered paper shadow */
:root{--paper-shadow:0 .5px 1px rgba(28,25,21,.05),0 2px 4px rgba(28,25,21,.035),0 8px 18px rgba(28,25,21,.04),0 22px 44px rgba(28,25,21,.035)}
/* a few sheets under a closed document: it reads as a stack of paper */
.fb-stack{position:absolute;top:0;width:var(--pw);height:var(--ph);transition:opacity .3s ease}
.fb-stack i{left:0;box-shadow:var(--paper-shadow)}
.fb-stack i:nth-child(1){transform:translate(3px,3px) rotate(.5deg)}
.fb-stack i:nth-child(2){transform:translate(1.5px,1.5px) rotate(-.35deg)}
/* spine shading, shared by pages and the bending leaf */
.sp-l::after,.sp-r::after{content:"";position:absolute;top:0;bottom:0;width:12%;pointer-events:none}
.sp-l::after{right:0;background:linear-gradient(to left,rgba(28,25,21,.08),rgba(28,25,21,.025) 40%,transparent)}
.sp-r::after{left:0;background:linear-gradient(to right,rgba(28,25,21,.08),rgba(28,25,21,.025) 40%,transparent)}
/* bending leaf: nested strips, each turned a little more, give a real curve */
.lf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:3;pointer-events:none}
.lf .s{position:absolute;top:0;height:var(--ph);transform-origin:left center;transform-style:preserve-3d}
.lf .s>b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-color:var(--sheet);background-repeat:no-repeat}
.lf .s>b.k{transform:rotateY(180deg)}
.lf .s>b>u{position:absolute;inset:0;background:#1c1915;opacity:0}
.fb-cast{position:absolute;top:0;height:var(--ph);width:var(--pw);pointer-events:none;z-index:2;opacity:0}
/* single sheet (1–2 pages): turns over on its own axis */
.fb-sheet{left:0;transform-style:preserve-3d;box-shadow:none}
.fb-sheet>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);overflow:hidden;box-shadow:var(--paper-shadow)}
.fb-sheet>div img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.fb-sheet>div.k{transform:rotateY(180deg)}
.fb-sheet>div>u{position:absolute;inset:0;background:#1c1915;opacity:0;pointer-events:none}
.rd-meta{position:absolute;left:50%;width:min(36rem,calc(100% - 2rem));transform:translateX(-50%);text-align:center;opacity:0}
.rd-meta .date{font-family:var(--sans);font-size:.85rem;font-weight:500;color:var(--mute);margin:0 0 .3rem}
.rd-meta .t{font-size:1.25rem;font-weight:500;line-height:1.25;text-wrap:balance;margin:0}
.rd-meta a{display:inline-block;margin-top:.5rem;font-family:var(--sans);font-size:.85rem;color:var(--accent);border-bottom:1px solid currentColor}
@media (prefers-reduced-motion:reduce){.fb-book{transition:none}.thumb,.feature .cover,.feature .cover img{transition:none}.grid button:hover .thumb,.grid button:focus-visible .thumb,.feature .cover:hover,.feature .cover:focus-visible{transform:none}.grid li.in,.feature.in .cover,.feature.in .meta{animation:none}}
@media(max-width:760px){
  .page{padding:0 1.15rem}
  .feature{gap:1.5rem;margin:2rem auto 4rem}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.75rem 1rem}
  .feature .cover{width:min(22rem,100%)}
  .rd-meta .t{font-size:1.1rem}
  .rd-close{top:.75rem;right:1rem}
}
</style>
<script src="/lib/sanitize.js"></script>
</head>
<body>
<div class="page">
  <header>
    <a class="mast" href="/v4">Trond Worren</a>
    <nav aria-label="Hovedmeny"><a href="/v4">Forside</a><a href="/v4/arkiv" aria-current="page">Arkiv</a></nav>
  </header>
  <h1 class="sr">Arkiv</h1>
  <section class="feature" id="feature" aria-label="Tilfeldig dokument"></section>
  <section aria-label="Alle dokumenter">
    <div class="browse-head">
      <div class="years" id="years" role="group" aria-label="År"></div>
    </div>
    <ul class="grid" id="grid"></ul>
    <p class="count" id="count"></p>
    <div class="more"><button class="btn ghost" id="more" hidden>Vis flere</button></div>
    <div id="sentinel" aria-hidden="true"></div>
  </section>
  <footer class="site">Alt innhold tilhører Trond Worren</footer>
</div>

<div class="rd" id="reader" role="dialog" aria-modal="true" aria-labelledby="rdT">
  <div class="rd-bg"></div>
  <div class="fb-stage" id="fbStage" aria-live="polite"><div class="fb-fly" id="fbFly"></div><div class="rd-meta" id="rdMeta"></div></div>
  <button class="btn ghost rd-close" id="rdClose">Lukk</button>
</div>
</div>

<script>
const MNF=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const fDate=d=>{const t=new Date(d+'T12:00:00');return `${t.getDate()}. ${MNF[t.getMonth()]} ${t.getFullYear()}`;};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const title=t=>TWSanitize.sanitizeSubject(t)||'Uten tittel';
const src=(d,w)=>`/covers/${d.id}-${w}.webp`;
const BATCH=48;
let DOCS=[],view=[],shown=0,year=null,cur=-1,list=[];

function feature(d){
  const el=document.getElementById('feature');
  el.innerHTML=`
    <button class="cover" style="--ar:${d.w}/${d.h}" id="fOpen" aria-label="Åpne ${esc(title(d.t))}">
      <img src="${src(d,720)}" srcset="${src(d,360)} 360w, ${src(d,720)} 720w" sizes="(max-width:760px) 20rem, 26rem" width="${d.w}" height="${d.h}" alt="">
    </button>
    <div class="meta">
      <p class="date">${fDate(d.d)}</p>
      <h2 style="margin:0">${esc(title(d.t))}</h2>
    </div>`;
  const b=document.getElementById('fOpen');b.onclick=()=>openReader(d,b.querySelector('img'));
  el.classList.remove('in');void el.offsetWidth;el.classList.add('in');
}
function pick(not){let d;do{d=DOCS[Math.floor(Math.random()*DOCS.length)];}while(DOCS.length>1&&d===not);return d;}

function years(){
  const ys=[...new Set(DOCS.map(d=>d.d.slice(0,4)))].sort();
  const el=document.getElementById('years');
  el.innerHTML=[`<button aria-pressed="true" data-y="">Alle</button>`,...ys.map(y=>`<button aria-pressed="false" data-y="${y}">${y}</button>`)].join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;year=b.dataset.y||null;
    el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));reset();};
}
function reset(){view=year?DOCS.filter(d=>d.d.startsWith(year)):DOCS;shown=0;document.getElementById('grid').innerHTML='';render();}
function render(){
  const next=view.slice(shown,shown+BATCH);
  document.getElementById('grid').insertAdjacentHTML('beforeend',next.map((d,k)=>`
    <li class="in" style="--i:${Math.min(k,16)}"><button data-k="${shown+k}" aria-label="${esc(title(d.t))}, ${fDate(d.d)}">
      <span class="thumb" style="--ar:${d.w}/${d.h}"><img loading="lazy" decoding="async" src="${src(d,360)}" srcset="${src(d,360)} 360w, ${src(d,720)} 720w" sizes="(max-width:760px) 45vw, 12rem" width="${d.w}" height="${d.h}" alt=""></span>
      <span class="cap">${fDate(d.d)}</span>
    </button></li>`).join(''));
  shown+=next.length;
  document.getElementById('count').textContent=`${shown} av ${view.length}`;
  document.getElementById('more').hidden=shown>=view.length;
}
document.getElementById('grid').onclick=e=>{const b=e.target.closest('button[data-k]');if(b)openReader(view[+b.dataset.k],b.querySelector('img'));};
document.getElementById('more').onclick=render;
new IntersectionObserver(es=>{if(es[0].isIntersecting&&shown&&shown<view.length)render();},{rootMargin:'800px'}).observe(document.getElementById('sentinel'));

// ── Reader ───────────────────────────────────────────────────────────────
// A cover click lifts the document from its card to the centre, closed. Flipping
// (click, drag, arrow keys) opens it into a spread; 1–2 page documents turn over
// like a single sheet. Closing sends the document back to its card as it is.
let FLIP={};
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const SPRING=(()=>{const k=180,c=24;let x=0,v=0;const pts=[],dt=1/120;for(let t=0;t<=1;t+=dt){v+=(-k*(x-1)-c*v)*dt;x+=v*dt;pts.push(x);}
  const step=Math.ceil(pts.length/40),s=pts.filter((_,i)=>i%step===0).map(p=>p.toFixed(4));s.push('1');const e=`linear(${s.join(',')})`;
  try{return CSS.supports('transition-timing-function',e)?e:'cubic-bezier(.2,.9,.25,1)';}catch{return 'cubic-bezier(.2,.9,.25,1)';}})();
document.documentElement.style.setProperty('--spring',SPRING);
const FLY_MS=760;
// physical spring for page turns, driven per frame so drags hand over their velocity
function spring(from,to,v0,fn,k=150,c=24){return new Promise(res=>{let x=from,v=v0||0,last=performance.now();
  const tick=t=>{let dt=Math.min(.032,(t-last)/1000);last=t;
    for(let n=0;n<4;n++){const a=-k*(x-to)-c*v;v+=a*dt/4;x+=v*dt/4;}
    if(Math.abs(x-to)<.0015&&Math.abs(v)<.01){fn(to);res();return;}fn(x);requestAnimationFrame(tick);};requestAnimationFrame(tick);});}

const R=document.getElementById('reader'),stage=document.getElementById('fbStage'),fly=document.getElementById('fbFly'),meta=document.getElementById('rdMeta');
let doc=null,N=0,pages=[],ar=.707,mode='book',two=false,pos=1,pw=0,ph=0,srcEl=null,busy=false,isOpen=false,lastFocus=null,book=null,sheetA=0;
const PS=i=>pages[i-1];
const spread=p=>two?(p===1?[0,1]:[p,p+1]):[p];
const nextPos=p=>two?(p===1?2:p+2):p+1;
const prevPos=p=>two?(p===2?1:p-2):p-1;
const atEnd=p=>two?(p===1?N<2:p+1>=N):p>=N;
const shiftFor=p=>{if(!two)return 0;const v=spread(p);if(v[0]<1)return -pw/2;if(v[1]>N)return pw/2;return 0;};
const im=i=>i>=1&&i<=N?`<img src="${PS(i)}" alt="Side ${i} av ${N}" draggable="false">`:'';
function pgHTML(i,side,v){if(i<1||i>N)return '';let sp='';if(two&&v[0]>=1&&v[1]<=N)sp=side==='l'?' sp-l':' sp-r';return `<div class="fb-pg ${two?side:'c'}${sp}" data-p="${i}">${im(i)}</div>`;}
function stackHTML(){return N>=3?`<div class="fb-stack" style="${two?'right:0':'left:0'};opacity:${pos===1?1:0}"><i></i><i></i></div>`:'';}
function draw(){
  if(mode==='sheet'){book.innerHTML=`<div class="fb-sheet" style="transform:rotateY(${sheetA}deg)"><div class="f">${im(1)}<u></u></div><div class="k">${N>1?im(2):''}<u></u></div></div>`;return;}
  const v=spread(pos);book.innerHTML=stackHTML()+(two?pgHTML(v[0],'l',v)+pgHTML(v[1],'r',v):pgHTML(v[0],'c',v));
  book.style.setProperty('--shift',shiftFor(pos)+'px');
  [pos+1,pos+2,pos+3].forEach(i=>{if(i<=N)new Image().src=PS(i);});
}
function layout(){
  const r=stage.getBoundingClientRect(),narrow=r.width<760,metaH=narrow?84:96,top=narrow?60:64,padX=narrow?20:64;
  two=mode==='book'&&!narrow;const cols=two?2:1;
  ph=Math.min(r.height-top-metaH-12,(r.width-padX*2)/(cols*ar),narrow?9999:r.height*.78);pw=ph*ar;
  R.style.setProperty('--pw',pw+'px');R.style.setProperty('--ph',ph+'px');R.style.setProperty('--cols',cols);
  const bt=top+Math.max(0,(r.height-top-metaH-ph)/2);
  book.style.left=(r.width-cols*pw)/2+'px';book.style.top=bt+'px';
  meta.style.top=bt+ph+(narrow?16:22)+'px';
  if(two&&pos>1&&pos%2===1)pos--;
  book.style.transition='none';draw();void book.offsetWidth;book.style.transition='';
}
function visibleRect(){const els=[...book.querySelectorAll('.fb-pg,.fb-sheet')];const rs=els.map(e=>e.getBoundingClientRect());
  if(!rs.length)return book.getBoundingClientRect();
  const l=Math.min(...rs.map(r=>r.left)),t=Math.min(...rs.map(r=>r.top)),rr=Math.max(...rs.map(r=>r.right)),b=Math.max(...rs.map(r=>r.bottom));return {left:l,top:t,width:rr-l,height:b-t,right:rr,bottom:b};}
function flyTransform(a,b){const s=stage.getBoundingClientRect();
  fly.style.transformOrigin=`${a.left-s.left}px ${a.top-s.top}px`;
  return `translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.width/a.width},${b.height/a.height})`;}
// ── open / close: one overlay, transform + opacity only, guarded by a small state machine ──
let phase='closed',pendingClose=false,cleanup=[];
const later=(fn,ms)=>{const t=setTimeout(fn,ms);cleanup.push(()=>clearTimeout(t));};
const chrome=()=>[meta,R.querySelector('.rd-close')];
function fadeTo(el,to,ms,delay=0){const from=getComputedStyle(el).opacity;el.getAnimations().forEach(a=>a.cancel());
  const a=el.animate([{opacity:from},{opacity:to}],{duration:ms,delay,easing:'ease-out',fill:'forwards'});
  a.finished.then(()=>{el.style.opacity=to;a.cancel();}).catch(()=>{});return a;}
const animDone=(a,ms)=>Promise.race([a.finished.catch(()=>{}),new Promise(r=>later(r,ms+150))]);
const decoded=(img,ms=400)=>img&&img.decode?Promise.race([img.decode().catch(()=>{}),new Promise(r=>setTimeout(r,ms))]):Promise.resolve();

async function openReader(d,el){
  if(phase!=='closed')return;phase='opening';pendingClose=false;doc=d;srcEl=el;lastFocus=document.activeElement;
  const m=FLIP[d.id];N=m?m.n:1;ar=m?m.w/m.h:d.w/d.h;
  pages=m?Array.from({length:N},(_,i)=>`/flip/${d.id}/${i+1}.webp`):[];
  pages[0]=el.currentSrc||src(d,720); // exactly the pixels already on screen
  mode=N>=3?'book':'sheet';pos=1;sheetA=0;
  meta.innerHTML=`<p class="date">${fDate(d.d)}</p><h2 class="t" id="rdT">${esc(title(d.t))}</h2>${!m&&d.pdf?`<a href="https://drive.google.com/file/d/${encodeURIComponent(d.pdf)}/view" target="_blank" rel="noopener">Åpne i Google Drive</a>`:''}`;
  fly.innerHTML='<div class="fb-book" id="fbBook"></div>';book=fly.firstChild;
  chrome().forEach(e=>e.style.opacity=0);R.querySelector('.rd-bg').style.opacity=0;
  R.classList.add('on');document.documentElement.classList.add('rd-lock');layout();
  await decoded(book.querySelector('img'));
  const a=el.getBoundingClientRect(),b=visibleRect();
  el.style.visibility='hidden'; // the flying copy covers it in this same frame
  if(!reduce.matches){
    const an=fly.animate([{transform:flyTransform(b,a)},{transform:'none'}],{duration:FLY_MS,easing:SPRING});
    fadeTo(R.querySelector('.rd-bg'),1,360);chrome().forEach(e=>fadeTo(e,1,280,300));
    await animDone(an,FLY_MS);
  }else{R.querySelector('.rd-bg').style.opacity=1;chrome().forEach(e=>e.style.opacity=1);}
  phase='open';R.querySelector('.rd-close').focus({preventScroll:true});
  // a hi-res cover replaces the card's image once it is decoded
  const hi=new Image();hi.src=src(d,720);decoded(hi,3000).then(()=>{if(phase==='open'&&pages[0]!==hi.src){pages[0]=hi.src;const c=book.querySelector('.fb-pg[data-p="1"] img,.fb-sheet .f img');if(c)c.src=hi.src;}});
  if(pendingClose)closeReader();
}
async function closeReader(){
  if(phase==='opening'){pendingClose=true;return;}
  if(phase!=='open')return;phase='closing';drag=null;
  const bg=R.querySelector('.rd-bg');
  chrome().forEach(e=>fadeTo(e,0,160));
  if(!reduce.matches){
    // 1. an open spread folds shut in one motion: the left-hand pages swing back over the cover
    while(turning)await new Promise(r=>requestAnimationFrame(r));
    if(mode==='book'&&pos!==1){
      const from=pos;const set=prepTurn(1,from);if(two)book.style.setProperty('--shift',shiftFor(1)+'px');
      set(1);
      // hand over to the flight as the fold lands, so close reads as one motion
      await new Promise(res=>{let handed=false;spring(1,0,0,p=>{set(Math.max(0,Math.min(1,p)));if(!handed&&p<.06){handed=true;res();}},260,32).then(()=>{if(phase==='closing'){pos=1;draw();}if(!handed)res();});});
      pos=1;}
    if(mode==='sheet'&&sheetA!==0){const sh=book.querySelector('.fb-sheet');spring(sheetA,0,0,a=>{sh.style.transform=`rotateY(${a}deg)`;},240,31);sheetA=0;} // turns back over while it flies
  }else{pos=1;sheetA=0;draw();}
  // 2. the closed document flies back into its card; the card is uncovered only once it has landed
  const t=srcEl&&srcEl.isConnected?srcEl.getBoundingClientRect():null;
  const visible=t&&t.width&&t.bottom>0&&t.top<innerHeight;
  await decoded(srcEl);
  if(reduce.matches){finish();return;}
  fadeTo(bg,0,FLY_MS*.7);
  let an;
  if(visible){const v=visibleRect();an=fly.animate([{transform:'none'},{transform:flyTransform(v,t)}],{duration:FLY_MS,easing:SPRING,fill:'forwards'});}
  else an=fly.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.96)'}],{duration:320,easing:'ease-in',fill:'forwards'});
  await animDone(an,FLY_MS);
  finish();
}
function finish(){
  if(srcEl)srcEl.style.visibility='';            // same pixels as the landed copy
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ // remove the overlay only after the card has painted
    fly.getAnimations().forEach(a=>a.cancel());fly.innerHTML='';fly.style.transformOrigin='';
    R.classList.remove('on');document.documentElement.classList.remove('rd-lock');
    [R.querySelector('.rd-bg'),...chrome()].forEach(e=>{e.getAnimations().forEach(a=>a.cancel());e.style.opacity=0;});
    cleanup.forEach(f=>f());cleanup=[];turning=false;phase='closed';
    if(lastFocus&&lastFocus.isConnected)lastFocus.focus({preventScroll:true});}));
}

// ── bending leaf ──
const STRIPS=()=>innerWidth<760?12:18;
function makeLeaf(frontI,backI,left){
  const S=STRIPS(),w=pw/S,lf=document.createElement('div');lf.className='lf';lf.style.left=left+'px';
  const bg=(i,x)=>i>=1&&i<=N?`background-image:url('${PS(i)}');background-size:${pw}px ${ph}px;background-position:${x}px 0`:'';
  let parent=lf;const strips=[];
  for(let i=0;i<S;i++){const s=document.createElement('div');s.className='s';s.style.cssText=`left:${i?w:0}px;width:${w+.6}px`;
    s.innerHTML=`<b style="${bg(frontI,-i*w)}"><u></u></b><b class="k" style="${bg(backI,-(pw-(i+1)*w))}"><u></u></b>`;
    parent.appendChild(s);parent=s;strips.push(s);}
  // spine shading on the leaf itself, so it matches the pages around it
  const sh=document.createElement('div');
  strips[0].firstChild.classList.add('sp-r');strips[0].lastChild.classList.add('sp-l');
  const us=strips.map(s=>s.querySelectorAll(':scope>b>u'));
  return {el:lf,set(p,dir){ // p 0→1: the page lifts from the right and lays down on the left
    const bend=Math.sin(Math.PI*p)*.42;let prev=0;
    for(let i=0;i<S;i++){const x=(i+.5)/S;const phi=-180*Math.min(1,p+bend*(1-p)*Math.pow(x,1.7)*(p<.5?1:1-((p-.5)*1.2)));
      strips[i].style.transform=`rotateY(${(phi-prev).toFixed(2)}deg)`;prev=phi;
      const shade=Math.abs(Math.sin(phi*Math.PI/180));us[i][0].style.opacity=(shade*.14).toFixed(3);us[i][1].style.opacity=(shade*.11).toFixed(3);}
  }};
}
// a turn always runs "forward" from spread a to spread b; going back just plays it in reverse
function prepTurn(a,b){
  const va=spread(a),vb=spread(b),cast=document.createElement('div');cast.className='fb-cast';
  let leaf;
  if(two){book.innerHTML=pgHTML(va[0],'l',[va[0],vb[1]])+pgHTML(vb[1],'r',[va[0],vb[1]]);
    // the turning page keeps its spine shade only while a page sits opposite it
    leaf=makeLeaf(va[1],vb[0],pw);cast.style.left=pw+'px';
    if(va[0]<1)leaf.el.querySelector('.sp-r')?.classList.remove('sp-r');
    if(vb[1]>N)leaf.el.querySelector('.sp-l')?.classList.remove('sp-l');
    book.style.setProperty('--shift','0px');
  }else{book.innerHTML=pgHTML(vb[0],'c',vb);leaf=makeLeaf(va[0],0,0);leaf.el.querySelectorAll('.sp-r,.sp-l').forEach(e=>e.classList.remove('sp-r','sp-l'));}
  book.appendChild(cast);book.appendChild(leaf.el);
  return p=>{leaf.set(p,1);const lift=Math.sin(Math.PI*p);
    cast.style.opacity=lift.toFixed(3);cast.style.background=`linear-gradient(to right,rgba(28,25,21,${(.10*lift).toFixed(3)}),rgba(28,25,21,0) ${30+50*(1-p)}%)`;
    if(!two)leaf.el.style.opacity=p<.55?1:Math.max(0,1-(p-.55)/.4);};
}
let turning=false;
async function turn(dir,v0=0){
  if(phase!=='open'||turning)return;
  if(mode==='sheet')return flipSheet(dir);
  if(dir>0&&atEnd(pos))return;if(dir<0&&pos<=1)return;
  const a=dir>0?pos:prevPos(pos),b=dir>0?nextPos(pos):pos;
  if(reduce.matches){pos=dir>0?b:a;draw();return;}
  turning=true;const set=prepTurn(a,b);
  if(two)book.style.setProperty('--shift',shiftFor(dir>0?b:a)+'px');
  set(dir>0?0:1);await spring(dir>0?0:1,dir>0?1:0,v0,p=>set(Math.max(0,Math.min(1,p))));
  pos=dir>0?b:a;turning=false;draw();
}
// 1–2 page documents: the sheet turns over around its own centre, lifting a little as it goes
async function flipSheet(dir,from,v0=0){
  const sh=book.querySelector('.fb-sheet');const target=sheetA===0?180:0;
  if(reduce.matches){sheetA=target;draw();return;}
  turning=true;const start=from??sheetA;const us=sh.querySelectorAll('u');
  await spring(start,target,v0,a=>{const t=Math.abs(Math.sin(a*Math.PI/180));
    sh.style.transform=`translateZ(${(t*70).toFixed(1)}px) rotateY(${a.toFixed(2)}deg) rotateZ(${(t*-1.2).toFixed(2)}deg)`;
    us[0].style.opacity=us[1].style.opacity=(t*.12).toFixed(3);},170,26);
  sheetA=target;turning=false;
}

// ── input: click a page, drag it, or use the arrow keys ──
let drag=null;
stage.addEventListener('pointerdown',e=>{if(phase!=='open'||turning||e.button>0)return;
  const onDoc=!!e.target.closest('.fb-book');drag={x:e.clientX,y:e.clientY,t:performance.now(),onDoc,set:null,id:e.pointerId,p:0,v:0};});
stage.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||!drag.onDoc)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.set){if(Math.abs(dx)<8||Math.abs(dx)<Math.abs(dy))return;const dir=dx<0?1:-1;
    if(mode==='sheet'){drag.sheet=true;drag.dir=dir;}
    else{if((dir>0&&atEnd(pos))||(dir<0&&pos<=1)||reduce.matches){drag=null;return;}
      drag.dir=dir;drag.a=dir>0?pos:prevPos(pos);drag.b=dir>0?nextPos(pos):pos;turning=true;drag.set=prepTurn(drag.a,drag.b);
      if(two)book.style.setProperty('--shift',shiftFor(dir>0?drag.b:drag.a)+'px');}
    drag.set=drag.set||(()=>{});stage.setPointerCapture(e.pointerId);}
  const w=(two?pw*2:pw)*.85,now=performance.now();
  if(drag.sheet){const k=Math.max(0,Math.min(1,Math.abs(dx)/(pw*.9)));drag.p=k;const a=sheetA+(sheetA===0?180:-180)*k;
    const sh=book.querySelector('.fb-sheet');sh.style.transform=`translateZ(${Math.abs(Math.sin(a*Math.PI/180))*70}px) rotateY(${a}deg)`;drag.ang=a;}
  else{const p=drag.dir>0?Math.max(0,Math.min(1,-dx/w)):Math.max(0,Math.min(1,1-dx/w));drag.v=(p-drag.p)/Math.max(1,now-drag.t)*1000;drag.p=p;drag.set(p);}
  drag.t=now;});
const endDrag=async e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;
  if(!d.set){if(Math.abs(e.clientX-d.x)<8&&Math.abs(e.clientY-d.y)<8){
      if(!d.onDoc){closeReader();return;}
      const r=book.querySelector('.fb-pg,.fb-sheet')?visibleRect():book.getBoundingClientRect();
      if(mode==='sheet'||pos===1)turn(1);else turn(e.clientX<r.left+r.width/2?-1:1);}return;}
  if(d.sheet){turning=true;await flipSheet(0,d.ang);return;}
  const goingFwd=d.dir>0,p=d.p,v=d.v;let target;
  if(Math.abs(v)>1.2)target=v<0?0:1;else target=p>.5?1:0;
  // a drag "forward" completes at 1, a drag "back" completes at 0
  await spring(p,target,v,x=>d.set(Math.max(0,Math.min(1,x))));
  pos=target===1?d.b:d.a;turning=false;draw();};
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
R.querySelector('.rd-close').onclick=closeReader;
document.addEventListener('keydown',e=>{if(phase==='closed')return;
  if(e.key==='Escape'){e.preventDefault();closeReader();}
  if(e.key==='ArrowRight'){e.preventDefault();turn(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();turn(-1);}
  if(e.key==='Tab'){e.preventDefault();R.querySelector('.rd-close').focus();}});
addEventListener('resize',()=>{if(phase==='open'&&!turning)layout();});

Promise.all([fetch('/data/documents.json').then(r=>r.json()),fetch('/flip/manifest.json').then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,f])=>{
  DOCS=d;FLIP=f;
  const want=new URLSearchParams(location.search).get('dok');
  const flipDocs=DOCS.filter(x=>FLIP[x.id]);
  const start=DOCS.find(x=>x.id===want)||(flipDocs.length?flipDocs[Math.floor(Math.random()*flipDocs.length)]:pick());
  feature(start);years();reset();
  if(want&&start.id===want)requestAnimationFrame(()=>openReader(start,document.querySelector('#fOpen img')));
});
</script>
