<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkiv · Trond Worren</title>
<link rel="preload" href="/fonts/EBGaramond-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'EB Garamond';src:url('/fonts/EBGaramond-var.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:'EB Garamond';src:url('/fonts/EBGaramond-Italic-var.woff2') format('woff2');font-weight:400 700;font-style:italic;font-display:swap}
:root{
  --paper:#f6f1e8; --ink:#1c1915; --mute:#5a5248; --accent:#8c3d16; --sheet:#fffdf8;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:18px;-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.55}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.page{max-width:76rem;margin:0 auto;padding:0 2rem}
header{display:flex;flex-direction:column;align-items:center;gap:.9rem;padding:2.75rem 0 0;text-align:center}
.mast{font-size:1.6rem;font-weight:500;line-height:1.1}
nav{display:flex;gap:1.5rem;font-family:var(--sans);font-size:.9rem;font-weight:500}
nav a{border-bottom:1px solid transparent;padding-bottom:1px}
nav a:hover,nav a[aria-current="page"]{border-bottom-color:var(--ink)}
/* feature */
.feature{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2rem;margin:3.5rem auto 5.5rem;max-width:44rem}
.feature .cover{display:block;width:min(30rem,100%);aspect-ratio:var(--ar,0.707);background:var(--sheet);box-shadow:0 1px 2px rgba(28,25,21,.08),0 12px 32px rgba(28,25,21,.12);border:0;padding:0;cursor:zoom-in;overflow:hidden;transition:transform .3s ease,box-shadow .3s ease}
.feature .cover:hover,.feature .cover:focus-visible{transform:translateY(-4px);box-shadow:0 2px 4px rgba(28,25,21,.1),0 20px 44px rgba(28,25,21,.18)}
.feature .cover:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.feature .cover img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .25s ease}
.feature .meta{max-width:36rem}
.feature .date{font-family:var(--sans);font-size:.9rem;font-weight:500;color:var(--mute);margin:0 0 .6rem}
.feature h2{font-size:clamp(1.7rem,3vw,2.2rem);font-weight:500;line-height:1.2;margin:0 0 2rem;text-wrap:balance}
.actions{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:.5rem;height:2.6rem;padding:0 1.1rem;border-radius:6px;font-family:var(--sans);font-size:.9rem;font-weight:500;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;transition:background .15s,color .15s}
.btn:hover{background:#3a332b;border-color:#3a332b}
.btn.ghost{background:transparent;color:var(--ink);border-color:rgba(28,25,21,.35)}
.btn.ghost:hover{background:rgba(28,25,21,.06)}
/* browse */
.browse-head{display:flex;justify-content:center;margin:0 0 2rem}
.years{display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem;font-family:var(--sans);font-size:.9rem;font-weight:500}
.years button{font:inherit;color:var(--ink);background:none;border:0;border-radius:6px;padding:.4rem .65rem;cursor:pointer}
.years button:hover{background:rgba(28,25,21,.06)}
.years button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grid{list-style:none;margin:0 auto;padding:0;max-width:72rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:2.25rem 1.75rem}
.grid li{margin:0}
.grid button{display:block;width:100%;border:0;padding:0;background:none;text-align:left;cursor:zoom-in;color:inherit}
.grid button:focus-visible{outline:none}
.grid button:focus-visible .thumb{outline:2px solid var(--ink);outline-offset:4px}
.thumb{display:block;width:100%;aspect-ratio:1/1.414;background:var(--sheet);box-shadow:0 1px 2px rgba(28,25,21,.08),0 6px 16px rgba(28,25,21,.08);overflow:hidden;transition:transform .25s ease,box-shadow .25s ease}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
.grid button:hover .thumb,.grid button:focus-visible .thumb{transform:translateY(-3px);box-shadow:0 2px 4px rgba(28,25,21,.1),0 12px 24px rgba(28,25,21,.12)}
.cap{display:block;text-align:center;margin-top:.6rem;font-family:var(--sans);font-size:.85rem;font-weight:500;color:var(--mute)}
.more{display:flex;justify-content:center;margin:3rem 0 0}
.count{font-family:var(--sans);font-size:.9rem;color:var(--mute);margin:1rem 0 0;text-align:center}
footer.site{text-align:center;padding:5rem 0 3rem;font-family:var(--sans);font-size:.85rem;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* card entrance */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.grid li.in{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 35ms)}
.feature.in .cover{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.feature.in .meta{animation:rise .7s .08s cubic-bezier(.2,.8,.2,1) both}
/* reader (no modal: the cover itself travels into the reading position) */
.rd{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);visibility:hidden}
.rd.on{visibility:visible}
.rd-bg{position:absolute;inset:0;background:var(--paper);opacity:0}
.rd-top{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;padding:1rem 1.25rem .5rem;opacity:0}
.rd-meta{grid-column:2;text-align:center;min-width:0}
.rd-meta .date{font-family:var(--sans);font-size:.85rem;font-weight:500;color:var(--mute)}
.rd-meta .t{font-size:1.2rem;font-weight:500;line-height:1.25;text-wrap:balance}
.rd-meta a{font-family:var(--sans);font-size:.85rem;color:var(--accent);border-bottom:1px solid currentColor}
.rd-close{grid-column:3;justify-self:end}
.fb-stage{position:relative;min-height:0;perspective:2400px;user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:grab}
.fb-stage.dragging{cursor:grabbing}
.fb-book{position:absolute;left:50%;top:50%;width:calc(var(--pw) * var(--cols));height:var(--ph);transform:translate(-50%,-50%)}
.fb-pg{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--sheet);overflow:hidden;box-shadow:0 10px 30px rgba(28,25,21,.16),0 1px 3px rgba(28,25,21,.1)}
.fb-pg.l{left:0}.fb-pg.r{right:0}.fb-pg.c{left:0}
.fb-pg.blank{display:none}
.fb-pg img,.fb-face img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
/* spine shading: same gradient on pages and on the turning leaf, so it never jumps */
.sp-l::after,.sp-r::after{content:"";position:absolute;top:0;bottom:0;width:14%;pointer-events:none}
.sp-l::after{right:0;background:linear-gradient(to left,rgba(28,25,21,.13),rgba(28,25,21,.04) 35%,transparent)}
.sp-r::after{left:0;background:linear-gradient(to right,rgba(28,25,21,.13),rgba(28,25,21,.04) 35%,transparent)}
.fb-leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:3;will-change:transform}
.fb-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);overflow:hidden}
.fb-face.b{transform:rotateY(180deg)}
.fb-curl{position:absolute;inset:0;pointer-events:none;z-index:2}
.fb-cast{position:absolute;top:0;height:var(--ph);width:var(--pw);pointer-events:none;z-index:2;opacity:0}
@media (prefers-reduced-motion:reduce){.thumb,.feature .cover,.feature .cover img{transition:none}.grid button:hover .thumb,.grid button:focus-visible .thumb,.feature .cover:hover,.feature .cover:focus-visible{transform:none}.grid li.in,.feature.in .cover,.feature.in .meta{animation:none}}
@media(max-width:760px){
  .page{padding:0 1.15rem}
  .feature{gap:1.5rem;margin:2rem auto 4rem}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.75rem 1rem}
  .feature .cover{width:min(22rem,100%)}
  .rd-top{grid-template-columns:1fr auto;padding:.75rem 1rem .25rem}
  .rd-meta{grid-column:1;text-align:left}
  .rd-close{grid-column:2}
  .rd-meta .t{font-size:1.05rem}
}
</style>
<script src="/lib/sanitize.js"></script>
</head>
<body>
<div class="page">
  <header>
    <a class="mast" href="/v4">Trond Worren</a>
    <nav aria-label="Hovedmeny"><a href="/v4">Forside</a><a href="/v4/arkiv" aria-current="page">Arkiv</a></nav>
  </header>
  <h1 class="sr">Arkiv</h1>
  <section class="feature" id="feature" aria-label="Tilfeldig dokument"></section>
  <section aria-label="Alle dokumenter">
    <div class="browse-head">
      <div class="years" id="years" role="group" aria-label="År"></div>
    </div>
    <ul class="grid" id="grid"></ul>
    <p class="count" id="count"></p>
    <div class="more"><button class="btn ghost" id="more" hidden>Vis flere</button></div>
    <div id="sentinel" aria-hidden="true"></div>
  </section>
  <footer class="site">Alt innhold tilhører Trond Worren</footer>
</div>

<div class="rd" id="reader" role="dialog" aria-modal="true" aria-labelledby="rdT">
  <div class="rd-bg"></div>
  <div class="rd-top">
    <div class="rd-meta"><div class="date" id="rdD"></div><div class="t" id="rdT"></div><div id="rdL"></div></div>
    <button class="btn ghost rd-close" id="rdClose">Lukk</button>
  </div>
  <div class="fb-stage" id="fbStage" aria-live="polite"><div class="fb-book" id="fbBook"></div></div>
</div>

<script>
const MNF=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const fDate=d=>{const t=new Date(d+'T12:00:00');return `${t.getDate()}. ${MNF[t.getMonth()]} ${t.getFullYear()}`;};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const title=t=>TWSanitize.sanitizeSubject(t)||'Uten tittel';
const src=(d,w)=>`/covers/${d.id}-${w}.webp`;
const BATCH=48;
let DOCS=[],view=[],shown=0,year=null,cur=-1,list=[];

function feature(d){
  const el=document.getElementById('feature');
  el.innerHTML=`
    <button class="cover" style="--ar:${d.w}/${d.h}" id="fOpen" aria-label="Åpne ${esc(title(d.t))}">
      <img src="${src(d,720)}" srcset="${src(d,360)} 360w, ${src(d,720)} 720w" sizes="(max-width:760px) 20rem, 26rem" width="${d.w}" height="${d.h}" alt="">
    </button>
    <div class="meta">
      <p class="date">${fDate(d.d)}</p>
      <h2 style="margin:0">${esc(title(d.t))}</h2>
    </div>`;
  const b=document.getElementById('fOpen');b.onclick=()=>openReader(d,b.querySelector('img'));
  el.classList.remove('in');void el.offsetWidth;el.classList.add('in');
}
function pick(not){let d;do{d=DOCS[Math.floor(Math.random()*DOCS.length)];}while(DOCS.length>1&&d===not);return d;}

function years(){
  const ys=[...new Set(DOCS.map(d=>d.d.slice(0,4)))].sort();
  const el=document.getElementById('years');
  el.innerHTML=[`<button aria-pressed="true" data-y="">Alle</button>`,...ys.map(y=>`<button aria-pressed="false" data-y="${y}">${y}</button>`)].join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;year=b.dataset.y||null;
    el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));reset();};
}
function reset(){view=year?DOCS.filter(d=>d.d.startsWith(year)):DOCS;shown=0;document.getElementById('grid').innerHTML='';render();}
function render(){
  const next=view.slice(shown,shown+BATCH);
  document.getElementById('grid').insertAdjacentHTML('beforeend',next.map((d,k)=>`
    <li class="in" style="--i:${Math.min(k,16)}"><button data-k="${shown+k}" aria-label="${esc(title(d.t))}, ${fDate(d.d)}">
      <span class="thumb" style="--ar:${d.w}/${d.h}"><img loading="lazy" decoding="async" src="${src(d,360)}" srcset="${src(d,360)} 360w, ${src(d,720)} 720w" sizes="(max-width:760px) 45vw, 12rem" width="${d.w}" height="${d.h}" alt=""></span>
      <span class="cap">${fDate(d.d)}</span>
    </button></li>`).join(''));
  shown+=next.length;
  document.getElementById('count').textContent=`${shown} av ${view.length}`;
  document.getElementById('more').hidden=shown>=view.length;
}
document.getElementById('grid').onclick=e=>{const b=e.target.closest('button[data-k]');if(b)openReader(view[+b.dataset.k],b.querySelector('img'));};
document.getElementById('more').onclick=render;
new IntersectionObserver(es=>{if(es[0].isIntersecting&&shown&&shown<view.length)render();},{rootMargin:'800px'}).observe(document.getElementById('sentinel'));

// ── Reader: FLIP from the clicked cover into a flipbook, spring easing, drag-to-turn ──
let FLIP={};
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
// critically-damped-ish spring sampled into a CSS linear() easing
const SPRING=(()=>{const k=210,c=26,m=1;let x=0,v=0,pts=[];const dt=1/120;for(let t=0;t<=1.2;t+=dt){const a=(-k*(x-1)-c*v)/m;v+=a*dt;x+=v*dt;pts.push(x);}
  const step=Math.ceil(pts.length/48);const s=pts.filter((_,i)=>i%step===0).map(p=>p.toFixed(4));s.push('1');
  try{return CSS.supports('transition-timing-function',`linear(${s.join(',')})`)?`linear(${s.join(',')})`:'cubic-bezier(.2,.9,.25,1)';}catch{return 'cubic-bezier(.2,.9,.25,1)';}})();
const SPRING_MS=720;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);

const R=document.getElementById('reader'),stage=document.getElementById('fbStage'),book=document.getElementById('fbBook');
let doc=null,N=0,pages=[],ar=.707,two=false,pos=1,pw=0,ph=0,srcEl=null,anim=false,open=false,lastFocus=null;

function pageSrc(i){return pages[i-1];}
const img=i=>i>=1&&i<=N?`<img src="${pageSrc(i)}" alt="Side ${i} av ${N}" draggable="false">`:'';
const spread=p=>two?(p===1?[0,1]:[p,p+1]):[p];
const atEnd=()=>two?(pos===1?N<2:pos+1>=N):pos>=N;
function pg(i,side){const sp=two?(side==='l'?' sp-l':' sp-r'):'';return `<div class="fb-pg ${two?side:'c'}${sp}${i<1||i>N?' blank':''}" data-p="${i}">${img(i)}</div>`;}
function draw(){const v=spread(pos);book.innerHTML=two?pg(v[0],'l')+pg(v[1],'r'):pg(v[0],'c');
  [pos+1,pos+2,pos+3].forEach(i=>{if(i<=N)new Image().src=pageSrc(i);});}
function layout(){
  const r=stage.getBoundingClientRect(),narrow=r.width<760;const padX=narrow?16:64,padY=narrow?14:40;
  two=!narrow&&N>1;const cols=two?2:1;
  ph=Math.min(r.height-padY*2,(r.width-padX*2)/(cols*ar));pw=ph*ar;
  R.style.setProperty('--pw',pw+'px');R.style.setProperty('--ph',ph+'px');R.style.setProperty('--cols',cols);
  if(two&&pos>1&&pos%2===1)pos--;
  draw();
}
function coverEl(){return book.querySelector(`.fb-pg[data-p="1"]`);}

function openReader(d,el){
  if(open||anim)return;open=true;anim=true;doc=d;srcEl=el;lastFocus=document.activeElement;
  const m=FLIP[d.id];
  N=m?m.n:1;ar=m?m.w/m.h:d.w/d.h;
  pages=m?Array.from({length:N},(_,i)=>`/flip/${d.id}/${i+1}.webp`):[src(d,720)];
  pages[0]=src(d,720); // the cover the reader already sees, so nothing flashes during the flight
  document.getElementById('rdD').textContent=fDate(d.d);
  document.getElementById('rdT').textContent=title(d.t);
  document.getElementById('rdL').innerHTML=!m&&d.pdf?`<a href="https://drive.google.com/file/d/${encodeURIComponent(d.pdf)}/view" target="_blank" rel="noopener">Åpne i Google Drive</a>`:'';
  pos=1;R.classList.add('on');document.documentElement.style.overflow='hidden';layout();
  const c=coverEl(),to=c.getBoundingClientRect(),from=el.getBoundingClientRect();
  el.style.visibility='hidden';
  const fin=()=>{anim=false;document.getElementById('rdClose').focus({preventScroll:true});if(two&&N>1&&!reduce.matches)setTimeout(()=>turn(1),120);};
  if(reduce.matches){R.querySelector('.rd-bg').style.opacity=1;R.querySelector('.rd-top').style.opacity=1;fin();return;}
  const dx=from.left-to.left,dy=from.top-to.top,sx=from.width/to.width,sy=from.height/to.height;
  c.style.transformOrigin='0 0';
  c.animate([{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`},{transform:'none'}],{duration:SPRING_MS,easing:SPRING});
  R.querySelector('.rd-bg').animate([{opacity:0},{opacity:1}],{duration:380,easing:'ease-out',fill:'forwards'});
  R.querySelector('.rd-top').animate([{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none'}],{duration:360,delay:220,easing:'ease-out',fill:'forwards'});
  setTimeout(fin,SPRING_MS-120);
}
async function closeReader(){
  if(!open||anim)return;anim=true;
  if(pos!==1&&!reduce.matches){await turnTo(1,two?420:300);} else {pos=1;draw();}
  const done=()=>{R.classList.remove('on');document.documentElement.style.overflow='';book.innerHTML='';
    R.querySelectorAll('.rd-bg,.rd-top').forEach(e=>{e.getAnimations().forEach(a=>a.cancel());e.style.opacity='';});
    if(srcEl)srcEl.style.visibility='';open=false;anim=false;if(lastFocus)lastFocus.focus({preventScroll:true});};
  const c=coverEl(),from=srcEl&&srcEl.isConnected?srcEl.getBoundingClientRect():null;
  if(reduce.matches||!c||!from||from.bottom<0||from.top>innerHeight){done();return;}
  const to=c.getBoundingClientRect();
  book.querySelectorAll('.fb-pg:not([data-p="1"])').forEach(e=>e.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}));
  c.style.transformOrigin='0 0';
  const a=c.animate([{transform:'none'},{transform:`translate(${from.left-to.left}px,${from.top-to.top}px) scale(${from.width/to.width},${from.height/to.height})`}],{duration:SPRING_MS-80,easing:SPRING,fill:'forwards'});
  R.querySelector('.rd-top').animate([{opacity:1},{opacity:0}],{duration:180,fill:'forwards'});
  R.querySelector('.rd-bg').animate([{opacity:1},{opacity:0}],{duration:420,delay:120,easing:'ease-in',fill:'forwards'});
  a.onfinish=done;
}

// ── page turning ──
// A leaf is built for a turn from pos to `to`; setAngle drives it, so drag and animation share one code path.
function buildLeaf(dir,to){
  const v=spread(pos),nv=spread(to);
  const leaf=document.createElement('div');leaf.className='fb-leaf';
  const face=(i,cls,sp)=>`<div class="fb-face ${cls}${sp}">${img(i)}<div class="fb-curl"></div></div>`;
  let front,back,cast=document.createElement('div');cast.className='fb-cast';
  if(two){
    front=dir>0?v[1]:v[0];back=dir>0?nv[0]:nv[1];
    leaf.style.left=dir>0?pw+'px':'0px';leaf.style.transformOrigin=dir>0?'left center':'right center';
    leaf.innerHTML=face(front,'f',dir>0?' sp-r':' sp-l')+face(back,'b',dir>0?' sp-l':' sp-r');
    book.innerHTML=dir>0?pg(v[0],'l')+pg(nv[1],'r'):pg(nv[0],'l')+pg(v[1],'r');
    cast.style.left=dir>0?pw+'px':'0px';
  }else{
    leaf.style.left='0px';leaf.style.transformOrigin='left center';
    const p=dir>0?v[0]:nv[0];leaf.innerHTML=face(p,'f','')+`<div class="fb-face b"><div class="fb-curl"></div></div>`;
    book.innerHTML=pg(dir>0?nv[0]:v[0],'c');cast.style.left='0px';
  }
  // hide covered blank halves (cover spread / back cover)
  book.appendChild(cast);book.appendChild(leaf);
  return {leaf,cast,dir,to,
    set(p){ // p: 0 → 1 progress of the turn
      const s=two?dir:1;let deg=two?-180*p*dir:(dir>0?-180*p:-180*(1-p));
      const lift=Math.sin(Math.PI*Math.min(1,Math.max(0,two?p:(dir>0?p:1-p))));
      // slight curl: a touch of skew and scale toward the free edge while the page is in the air
      leaf.style.transform=`rotateY(${deg}deg) skewY(${(two?-dir:-1)*lift*1.2}deg) scaleX(${1-lift*.02})`;
      const curls=leaf.querySelectorAll('.fb-curl');
      const shade=lift*.16,hl=lift*.22;
      // front: darkens toward the spine as it lifts; back: highlight band along the fold
      curls[0].style.background=`linear-gradient(${(two?dir:1)>0?'to left':'to right'},rgba(255,255,255,${hl*.6}) 0%,rgba(255,255,255,0) 30%,rgba(28,25,21,${shade}) 100%)`;
      curls[1].style.background=`linear-gradient(${(two?dir:1)>0?'to right':'to left'},rgba(28,25,21,${shade*.9}) 0%,rgba(255,255,255,${hl*.5}) 60%,rgba(255,255,255,0) 100%)`;
      // shadow the turning page casts on the page it reveals
      cast.style.opacity=lift;cast.style.background=`linear-gradient(${(two?dir:1)>0?'to right':'to left'},rgba(28,25,21,${.22*lift}),rgba(28,25,21,0) ${20+60*(1-lift)}%)`;
    }};
}
function nextPos(dir){return dir>0?pos+(two?(pos===1?1:2):1):(two?(pos===2?1:pos-2):pos-1);}
let turning=null;
function animateLeaf(L,from,to,ms,fn){return new Promise(res=>{const t0=performance.now();
  const tick=t=>{const k=Math.min(1,(t-t0)/ms),p=from+(to-from)*fn(k);L.set(p);if(k<1)requestAnimationFrame(tick);else res();};requestAnimationFrame(tick);});}
async function turn(dir,ms=820){
  if(turning||!open)return;if(dir>0&&atEnd())return;if(dir<0&&pos<=1)return;
  const to=nextPos(dir);
  if(reduce.matches){pos=to;draw();return;}
  turning=buildLeaf(dir,to);turning.set(0);
  await animateLeaf(turning,0,1,ms,ease);pos=to;turning=null;draw();
}
async function turnTo(target,ms){while(pos!==target&&pos>target){await turn(-1,ms);}}

// drag: grab either half; the page follows the pointer, release completes or settles back
let drag=null;
stage.addEventListener('pointerdown',e=>{if(!open||anim||turning||e.button>0)return;const r=book.getBoundingClientRect();
  drag={x:e.clientX,y:e.clientY,t:performance.now(),dir:e.clientX>r.left+r.width/2?1:-1,L:null,p:0,w:two?r.width:r.width*1.1,id:e.pointerId};});
stage.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.L){if(Math.abs(dx)<8||Math.abs(dx)<Math.abs(dy))return;
    const dir=dx<0?1:-1;if((dir>0&&atEnd())||(dir<0&&pos<=1)||reduce.matches){drag=null;return;}
    drag.dir=dir;drag.L=buildLeaf(dir,nextPos(dir));turning=drag.L;stage.setPointerCapture(e.pointerId);stage.classList.add('dragging');}
  drag.p=Math.max(0,Math.min(1,(-dx*drag.dir)/(drag.w*.9)));drag.L.set(drag.p);drag.v=dx/(performance.now()-drag.t);});
const endDrag=async e=>{if(!drag)return;const d=drag;drag=null;stage.classList.remove('dragging');
  if(!d.L){ // a click: turn by side
    if(Math.abs(e.clientX-d.x)<8&&Math.abs(e.clientY-d.y)<8)turn(d.dir);return;}
  const fast=Math.abs(d.v||0)>.5&&Math.sign(-(d.v||0))===d.dir;const done=d.p>.4||fast;
  await animateLeaf(d.L,d.p,done?1:0,Math.max(220,560*(done?1-d.p:d.p)),easeOut);
  if(done)pos=d.L.to;turning=null;draw();};
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
// clicking the empty paper around the book closes the reader
R.querySelector('.rd-bg').addEventListener('click',closeReader);
stage.addEventListener('click',e=>{if(e.target===stage&&!turning)closeReader();});
document.getElementById('rdClose').onclick=closeReader;
document.addEventListener('keydown',e=>{if(!open)return;
  if(e.key==='Escape'){e.preventDefault();closeReader();}
  if(e.key==='ArrowRight'){e.preventDefault();turn(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();turn(-1);}
  if(e.key==='Tab'){e.preventDefault();document.getElementById('rdClose').focus();}});
addEventListener('resize',()=>{if(open&&!turning)layout();});

Promise.all([fetch('/data/documents.json').then(r=>r.json()),fetch('/flip/manifest.json').then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,f])=>{
  DOCS=d;FLIP=f;
  const want=new URLSearchParams(location.search).get('dok');
  const flipDocs=DOCS.filter(x=>FLIP[x.id]);
  const start=DOCS.find(x=>x.id===want)||(flipDocs.length?flipDocs[Math.floor(Math.random()*flipDocs.length)]:pick());
  feature(start);years();reset();
  if(want&&start.id===want)requestAnimationFrame(()=>openReader(start,document.querySelector('#fOpen img')));
});
</script>
