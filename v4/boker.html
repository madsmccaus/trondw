<style>
:root{--paper-shadow:0 .5px 1px rgba(var(--shc),.05),0 2px 4px rgba(var(--shc),.035),0 8px 18px rgba(var(--shc),.04),0 22px 44px rgba(var(--shc),.035)}

/* feature */
.feature{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2rem;margin:3.5rem auto 5.5rem;max-width:44rem}
.feature .cover{position:relative;display:block;width:min(30rem,100%);aspect-ratio:var(--ar,0.707);background:var(--sheet);box-shadow:var(--paper-shadow);border:0;padding:0;cursor:pointer;overflow:hidden;transition:transform 180ms cubic-bezier(.32,.72,0,1)}
.feature .cover::after{content:"";position:absolute;inset:0;box-shadow:0 1px 2px rgba(var(--shc),.05),0 4px 8px rgba(var(--shc),.04),0 14px 28px rgba(var(--shc),.05),0 32px 60px rgba(var(--shc),.04);opacity:0;transition:opacity 180ms cubic-bezier(.32,.72,0,1);pointer-events:none}
@media (hover:hover) and (pointer:fine){.feature .cover:hover{transform:translateY(-4px)}.feature .cover:hover::after{opacity:1}}
.feature .cover:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
@media (hover:hover) and (pointer:fine){.feature .cover:focus-visible{transform:translateY(-4px)}.feature .cover:focus-visible::after{opacity:1}}
.feature .cover img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .25s ease}

.btn{display:inline-flex;align-items:center;gap:.5rem;height:2.6rem;padding:0 1.1rem;border-radius:6px;font-family:var(--sans);font-size:.9rem;font-weight:500;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;transition:background .15s,color .15s,transform 150ms ease-out}
@media (hover:hover) and (pointer:fine){.btn:hover{background:color-mix(in oklab,var(--ink) 88%,var(--paper));border-color:color-mix(in oklab,var(--ink) 88%,var(--paper))}}
.btn:active{transform:scale(.97)}

@media (hover:hover) and (pointer:fine){.btn.ghost:hover{background:var(--hover)}}

.years button::before{content:"";position:absolute;inset:-.35rem -.15rem}
@media (hover:none),(pointer:coarse){.years button::before{inset:-.45rem -.15rem}}
@media (hover:hover) and (pointer:fine){.years button:hover{background:var(--hover)}}

.grid li{margin:0}
.grid button{display:block;width:100%;border:0;padding:0;background:none;text-align:left;cursor:pointer;color:inherit}
.grid button:focus-visible{outline:none}
.grid button:focus-visible .thumb{outline:2px solid var(--ink);outline-offset:4px}
.thumb{position:relative;display:block;width:100%;aspect-ratio:1/1.414;background:var(--sheet);box-shadow:var(--paper-shadow);overflow:hidden;transition:transform 180ms cubic-bezier(.32,.72,0,1)}
.thumb::after{content:"";position:absolute;inset:0;box-shadow:0 1px 2px rgba(var(--shc),.05),0 4px 8px rgba(var(--shc),.04),0 14px 28px rgba(var(--shc),.05),0 32px 60px rgba(var(--shc),.04);opacity:0;transition:opacity 180ms cubic-bezier(.32,.72,0,1);pointer-events:none}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
@media (hover:hover) and (pointer:fine){.grid button:hover .thumb{transform:translateY(-3px)}.grid button:hover .thumb::after{opacity:1}}

.more{display:flex;justify-content:center;margin:3rem 0 0}

/* load-more cards only */

.grid li.in-more{animation:rise-more .2s cubic-bezier(.32,.72,0,1) both;animation-delay:calc(var(--i,0) * 30ms)}
/* reader: the document itself travels from its card to the centre of the screen */
.rd{position:fixed;inset:0;z-index:50;visibility:hidden;isolation:isolate}
.rd.on{visibility:visible}
html{scrollbar-gutter:stable}
html.rd-lock{overflow:hidden}
.rd-bg,.rd-meta,.rd-close{opacity:0}
.rd-bg{position:absolute;inset:0;z-index:0;background:var(--paper);opacity:0}
.rd-close{position:absolute;top:1rem;right:1.25rem;z-index:5;opacity:0}
.fb-stage{position:absolute;inset:0;z-index:2;perspective:3400px;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.fb-fly{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.fb-book{position:absolute;width:calc(var(--pw) * var(--cols));height:var(--ph);transform-style:preserve-3d;pointer-events:auto;cursor:pointer;transform:translate3d(var(--shift,0px),0,0);transition:transform .75s var(--spring)}
.fb-pg,.fb-sheet,.fb-stack i{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--sheet)}
.fb-pg{overflow:hidden;box-shadow:var(--paper-shadow)}
.fb-pg.l{left:0}.fb-pg.r{right:0}.fb-pg.c{left:0}
/* no shadow falls across the spine, so the gutter looks the same whether a leaf lies on it or not */
.fb-pg.l{clip-path:inset(-60px 0 -60px -60px)}.fb-pg.r{clip-path:inset(-60px -60px -60px 0)}
.fb-pg.blank{display:none}
.fb-pg img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.thumb img,.feature .cover img,.fb-pg img,.fb-sheet>div img,.lf .s>b{filter:var(--page-filter)}
/* soft, layered paper shadow */
:root{--paper-shadow:0 .5px 1px rgba(var(--shc),.05),0 2px 4px rgba(var(--shc),.035),0 8px 18px rgba(var(--shc),.04),0 22px 44px rgba(var(--shc),.035)}
/* a few sheets under a closed document: it reads as a stack of paper */
.fb-stack{position:absolute;top:0;width:var(--pw);height:var(--ph);transition:opacity .3s ease}
.fb-stack i{left:0;box-shadow:var(--paper-shadow)}
.fb-stack i:nth-child(1){transform:translate(3px,3px) rotate(.5deg)}
.fb-stack i:nth-child(2){transform:translate(1.5px,1.5px) rotate(-.35deg)}
/* spine shading, shared by pages and the bending leaf */
/* bending leaf: nested strips, each turned a little more, give a real curve */
/* gutter shade: 12% of a page, on both sides of the spine */
.sp-l::after,.sp-r::after{content:"";position:absolute;top:0;bottom:0;width:12%;pointer-events:none}
.sp-l::after{right:0;background:linear-gradient(to left,rgba(var(--shc),.08),rgba(var(--shc),.025) 40%,transparent)}
.sp-r::after{left:0;background:linear-gradient(to right,rgba(var(--shc),.08),rgba(var(--shc),.025) 40%,transparent)}
.lf .s>b>i{position:absolute;inset:0;pointer-events:none}
.lf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:5;pointer-events:none}
.lf .s{position:absolute;top:0;height:var(--ph);transform-origin:left center;transform-style:preserve-3d}
.lf .s>b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-color:var(--sheet);background-repeat:no-repeat}
.lf .s>b.k{transform:rotateY(180deg)}
.lf .s>b>u{position:absolute;inset:0;background:rgb(var(--shc));opacity:0}
.fb-cast{position:absolute;top:0;height:var(--ph);width:var(--pw);pointer-events:none;z-index:4;opacity:0}
/* single sheet (1–2 pages): turns over on its own axis */
.fb-sheet{left:0;transform-style:preserve-3d;box-shadow:none}
.fb-sheet>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);overflow:hidden;box-shadow:var(--paper-shadow)}
.fb-sheet>div img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.fb-sheet>div.k{transform:rotateY(180deg)}
.fb-sheet>div>u{position:absolute;inset:0;background:rgb(var(--shc));opacity:0;pointer-events:none}
.rd-meta{position:absolute;left:0;z-index:-1;display:flex;flex-direction:column;align-items:center;width:min(36rem,calc(100vw - 2rem));max-width:calc(100vw - 2rem);text-align:center;opacity:0;transform:translateX(-50%);pointer-events:none}
.fb-pg,.fb-sheet,.fb-stack{z-index:1}
.rd-meta .date{font-family:var(--sans);font-size:.85rem;font-weight:500;color:var(--mute);margin:0 0 .3rem;width:100%;text-align:center}
.rd-meta .t{font-size:1.25rem;font-weight:500;line-height:1.25;text-wrap:balance;margin:0;width:100%;text-align:center}
.rd-meta a{display:inline-block;margin-top:.5rem;font-family:var(--sans);font-size:.85rem;color:var(--accent);border-bottom:1px solid currentColor;pointer-events:auto}
.rd-meta[data-under]{visibility:hidden}
@media (prefers-reduced-motion:reduce){.fb-book{transition:none}.thumb,.feature .cover,.feature .cover img{transition:none}.grid button:hover .thumb,.grid button:focus-visible .thumb,.feature .cover:hover,.feature .cover:focus-visible{transform:none}.grid li.in-more{animation:none}.years button:active,.btn:active{transform:none}}
@media(max-width:760px){
  .page{padding:0 1.15rem}
  .feature{gap:1.5rem;margin:2rem auto 4rem}

  .feature .cover{width:min(22rem,100%)}
  .rd-meta .t{font-size:1.1rem}
  .rd-close{top:.75rem;right:1rem}
}
.grid{align-content:start}

<script>
const MNF=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const fDate=d=>{const t=new Date(d+'T12:00:00');return `${t.getDate()}. ${MNF[t.getMonth()]} ${t.getFullYear()}`;};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const title=t=>TWSanitize.sanitizeSubject(t)||'Uten tittel';
const src=(d,w)=>`/covers/${d.id}-${w}.webp`;
const BATCH=48;
let DOCS=[],view=[],shown=0,year=null,cur=-1,list=[];

function feature(d){
  const el=document.getElementById('feature');
  el.innerHTML=`
    <button class="cover" style="--ar:${d.w}/${d.h}" id="fOpen" aria-label="Åpne ${esc(title(d.t))}">
      <img src="${src(d,720)}" srcset="${src(d,360)} 360w, ${src(d,720)} 720w" sizes="(max-width:760px) 20rem, 26rem" width="${d.w}" height="${d.h}" alt="">
    </button>
    <div class="meta">
      <p class="date">${fDate(d.d)}</p>
      <h2 style="margin:0">${esc(title(d.t))}</h2>
    </div>`;
  const b=document.getElementById('fOpen');b.onclick=()=>openReader(d,b.querySelector('img'));
}
function pick(not){let d;do{d=DOCS[Math.floor(Math.random()*DOCS.length)];}while(DOCS.length>1&&d===not);return d;}

function years(){
  const ys=[...new Set(DOCS.map(d=>d.d.slice(0,4)))].sort();
  const el=document.getElementById('years');
  el.innerHTML=[`<button aria-pressed="true" data-y="">Alle</button>`,...ys.map(y=>`<button aria-pressed="false" data-y="${y}">${y}</button>`)].join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;year=b.dataset.y||null;
    el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));reset();};
}
// changing year: the old covers stagger out while the new ones stagger in, over the same spot
function reset(){
  const g=document.getElementById('grid');view=year?DOCS.filter(d=>d.d.startsWith(year)):DOCS;
  if(reduce.matches||!g.children.length){shown=0;g.innerHTML='';render();return;}
  const wrap=g.parentElement;wrap.style.position='relative';
  document.querySelectorAll('.grid.ghost').forEach(x=>x.remove());
  const ghost=g.cloneNode(true);ghost.removeAttribute('id');ghost.classList.add('ghost');ghost.setAttribute('aria-hidden','true');ghost.inert=true;
  ghost.style.cssText=`position:absolute;left:${g.offsetLeft}px;top:${g.offsetTop}px;width:${g.offsetWidth}px;margin:0;pointer-events:none;z-index:1`;
  const top=innerHeight;let k=0;
  [...ghost.children].forEach(li=>{li.classList.remove('in');li.style.animation='none';const r=g.children[[...ghost.children].indexOf(li)]?.getBoundingClientRect();
    if(r&&r.bottom>0&&r.top<top){li.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-10px)'}],{duration:300,delay:Math.min(k++,18)*18,easing:'ease-in',fill:'forwards'});}
    else li.style.opacity=0;});
  wrap.appendChild(ghost);
  const h0=g.offsetHeight;g.style.minHeight=h0+'px';g.style.setProperty('--d0','140ms');
  shown=0;g.innerHTML='';render();
  const h1=g.scrollHeight&&[...g.children].length?g.lastElementChild.offsetTop+g.lastElementChild.offsetHeight-g.firstElementChild.offsetTop:0;
  const end=300+18*18+40;
  setTimeout(()=>{ghost.remove();g.style.removeProperty('--d0');
    const lc=g.lastElementChild,hn=lc?Math.ceil(lc.getBoundingClientRect().bottom-g.getBoundingClientRect().top):0;
    if(hn&&hn<h0){g.style.transition='min-height .42s cubic-bezier(.2,.8,.2,1)';requestAnimationFrame(()=>{g.style.minHeight=hn+'px';setTimeout(()=>{g.style.transition='';g.style.minHeight='';},460);});}else g.style.minHeight='';},end);
}
function render(){
  const batchStart=shown;
  const next=view.slice(shown,shown+BATCH);
  document.getElementById('grid').insertAdjacentHTML('beforeend',next.map((d,k)=>`
    <li${batchStart?` class="in-more" style="--i:${Math.min(k,5)}"`:''}><button data-k="${shown+k}" aria-label="${esc(title(d.t))}, ${fDate(d.d)}">
      <span class="thumb" style="--ar:${d.w}/${d.h}"><img loading="lazy" decoding="async" src="${src(d,360)}" srcset="${src(d,360)} 360w, ${src(d,720)} 720w" sizes="(max-width:760px) 45vw, 12rem" width="${d.w}" height="${d.h}" alt=""></span>
    </button></li>`).join(''));
  shown+=next.length;
  document.getElementById('count').textContent=`${shown} av ${view.length}`;
  document.getElementById('more').hidden=shown>=view.length;
}
document.getElementById('grid').onclick=e=>{const b=e.target.closest('button[data-k]');if(b)openReader(view[+b.dataset.k],b.querySelector('img'));};
document.getElementById('more').onclick=render;
new IntersectionObserver(es=>{if(es[0].isIntersecting&&shown&&shown<view.length)render();},{rootMargin:'800px'}).observe(document.getElementById('sentinel'));

// ── Reader ───────────────────────────────────────────────────────────────
// A cover click lifts the document from its card to the centre, closed. Flipping
// (click, drag, arrow keys) opens it into a spread; 1–2 page documents turn over
// like a single sheet. Closing sends the document back to its card as it is.
let FLIP={};
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const SPRING=(()=>{const k=180,c=24;let x=0,v=0;const pts=[],dt=1/120;for(let t=0;t<=1;t+=dt){v+=(-k*(x-1)-c*v)*dt;x+=v*dt;pts.push(x);}
  const step=Math.ceil(pts.length/40),s=pts.filter((_,i)=>i%step===0).map(p=>p.toFixed(4));s.push('1');const e=`linear(${s.join(',')})`;
  try{return CSS.supports('transition-timing-function',e)?e:'cubic-bezier(.2,.9,.25,1)';}catch{return 'cubic-bezier(.2,.9,.25,1)';}})();
document.documentElement.style.setProperty('--spring',SPRING);
const FLY_MS=760;
// physical spring for page turns, driven per frame so drags hand over their velocity
function spring(from,to,v0,fn,k=150,c=24){return new Promise(res=>{let x=from,v=v0||0,last=performance.now();
  const tick=t=>{let dt=Math.min(.032,(t-last)/1000);last=t;
    for(let n=0;n<4;n++){const a=-k*(x-to)-c*v;v+=a*dt/4;x+=v*dt/4;}
    if(Math.abs(x-to)<.0015&&Math.abs(v)<.01){fn(to);res();return;}fn(x);requestAnimationFrame(tick);};requestAnimationFrame(tick);});}

const R=document.getElementById('reader'),stage=document.getElementById('fbStage'),fly=document.getElementById('fbFly'),meta=document.getElementById('rdMeta');
let doc=null,N=0,pages=[],ar=.707,mode='book',two=false,pos=1,pw=0,ph=0,srcEl=null,lastFocus=null,book=null,sheetA=0;
const PS=i=>pages[i-1];
const spread=p=>two?(p===1?[0,1]:[p,p+1]):[p];
const nextPos=p=>two?(p===1?2:p+2):p+1;
const prevPos=p=>two?(p===2?1:p-2):p-1;
const atEnd=p=>two?(p===1?N<2:p+1>=N):p>=N;
const shiftFor=p=>{if(!two)return 0;const v=spread(p);if(v[0]<1)return -pw/2;if(v[1]>N)return pw/2;return 0;};
const im=i=>i>=1&&i<=N?`<img src="${PS(i)}" alt="Side ${i} av ${N}" draggable="false">`:'';
// a page carries the gutter shade whenever a page lies opposite it; during a turn the leaf is that page,
// so the shade is the same before, during and after the turn
const ex=i=>i>=1&&i<=N;
function pgHTML(i,side,shade){if(!ex(i))return '';const sp=two&&shade?(side==='l'?' sp-l':' sp-r'):'';return `<div class="fb-pg ${two?side:'c'}${sp}" data-p="${i}">${im(i)}</div>`;}
function stackHTML(){return N>=3?`<div class="fb-stack" style="${two?'right:0':'left:0'};opacity:${pos===1?1:0}"><i></i><i></i></div>`:'';}
function parkMeta(){if(meta.parentElement===book)book.removeChild(meta);}
function placeMeta(){if(phase!=='closed'&&book)book.insertBefore(meta,book.firstChild);}
function setBookHTML(html){parkMeta();book.innerHTML=html;placeMeta();}
function syncMetaUnderLeaf(){
  if(phase!=='open'||getComputedStyle(meta).opacity==='0'){meta.removeAttribute('data-under');return;}
  let under=false;
  if(T)under=T.p>0.06&&T.p<0.96;
  else if(drag&&drag.live)under=drag.p>0.06&&drag.p<0.96;
  else if(S)under=Math.abs(S.a-S.target)>5;
  if(under)meta.setAttribute('data-under','');else meta.removeAttribute('data-under');
}
function positionMeta(){
  if(!book||meta.parentElement!==book||!pw)return;
  let cx=pw/2,pagesWide=1;
  if(two){
    const v=spread(pos),hasL=ex(v[0]),hasR=ex(v[1]);
    if(hasL&&hasR){cx=pw;pagesWide=2;}
    else if(hasR){cx=pw*1.5;pagesWide=1;}
    else if(hasL){cx=pw*0.5;pagesWide=1;}
    else cx=pw;
  }
  meta.style.left=cx+'px';
  meta.style.transform='translateX(-50%)';
  meta.style.maxWidth=Math.min(36*parseFloat(getComputedStyle(document.documentElement).fontSize||'18'),pagesWide*pw,innerWidth-32)+'px';
}
function draw(){
  if(mode==='sheet'){setBookHTML(`<div class="fb-sheet" style="transform:rotateY(${sheetA}deg)"><div class="f">${im(1)}<u></u></div><div class="k">${N>1?im(2):''}<u></u></div></div>`);positionMeta();return;}
  const v=spread(pos);setBookHTML(stackHTML()+(two?pgHTML(v[0],'l',ex(v[1]))+pgHTML(v[1],'r',ex(v[0])):pgHTML(v[0],'c')));
  book.style.setProperty('--shift',shiftFor(pos)+'px');

function layout(){
  const r=stage.getBoundingClientRect(),narrow=r.width<760,metaH=narrow?84:96,top=narrow?60:64,padX=narrow?20:64;

  R.style.setProperty('--pw',pw+'px');R.style.setProperty('--ph',ph+'px');R.style.setProperty('--cols',cols);

  meta.style.top=(ph+(narrow?16:22))+'px';

}
function visibleRect(){const els=[...book.querySelectorAll('.fb-pg,.fb-sheet')];const rs=els.map(e=>e.getBoundingClientRect());
  if(!rs.length)return book.getBoundingClientRect();
  const l=Math.min(...rs.map(r=>r.left)),t=Math.min(...rs.map(r=>r.top)),rr=Math.max(...rs.map(r=>r.right)),b=Math.max(...rs.map(r=>r.bottom));return {left:l,top:t,width:rr-l,height:b-t,right:rr,bottom:b};}
function flyTransform(a,b){const s=stage.getBoundingClientRect();
  fly.style.transformOrigin=`${a.left-s.left}px ${a.top-s.top}px`;
  return `translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.width/a.width},${b.height/a.height})`;}
// ── open / close: one overlay, transform + opacity only. Every input is accepted at once. ──
let phase='closed',restRect=null,pendingTurns=0,cleanup=[];
const later=(fn,ms)=>{const t=setTimeout(fn,ms);cleanup.push(()=>clearTimeout(t));};
const chrome=()=>[meta,R.querySelector('.rd-close')];
function fadeTo(el,to,ms,delay=0){const from=getComputedStyle(el).opacity;el.getAnimations().forEach(a=>a.cancel());el.style.opacity=from;
  const a=el.animate([{opacity:from},{opacity:to}],{duration:ms,delay,easing:'ease-out',fill:'forwards'});
  a.finished.then(()=>{el.style.opacity=to;a.cancel();}).catch(()=>{});return a;}
const animDone=(a,ms)=>Promise.race([a.finished.catch(()=>{}),new Promise(r=>later(r,ms+150))]);
const decoded=(img,ms=400)=>img&&img.decode?Promise.race([img.decode().catch(()=>{}),new Promise(r=>setTimeout(r,ms))]):Promise.resolve();
let flyAnim=null;
function flyTo(fromT,toT,ms){if(flyAnim)flyAnim.cancel();fly.style.transform=fromT;
  flyAnim=fly.animate([{transform:fromT},{transform:toT}],{duration:ms,easing:SPRING,fill:'forwards'});return flyAnim;}

async function openReader(d,el){
  if(phase==='closing')finishNow();
  if(phase!=='closed')return;phase='opening';pendingTurns=0;doc=d;srcEl=el;lastFocus=document.activeElement;
  const m=FLIP[d.id];N=m?m.n:1;ar=m?m.w/m.h:d.w/d.h;
  pages=m?Array.from({length:N},(_,i)=>m.base?`${m.base}/${i+1}.webp`:`/flip/${d.id}/${i+1}.webp`):[];
  pages[0]=el.currentSrc||src(d,720);
  mode=N>=3?'book':'sheet';pos=1;sheetA=0;T=null;S=null;
  meta.innerHTML=`<p class="date">${fDate(d.d)}</p><h2 class="t" id="rdT">${esc(title(d.t))}</h2>${!m&&d.pdf?`<a href="https://drive.google.com/file/d/${encodeURIComponent(d.pdf)}/view" target="_blank" rel="noopener">Åpne i Google Drive</a>`:''}`;
  fly.querySelector('.fb-book')?.remove();
  book=document.createElement('div');book.className='fb-book';book.id='fbBook';fly.appendChild(book);
  book.appendChild(meta);fly.style.transform='none';
  chrome().forEach(e=>e.style.opacity=0);R.querySelector('.rd-bg').style.opacity=0;
  R.classList.add('on');document.documentElement.classList.add('rd-lock');layout();
  restRect=visibleRect();
  await decoded(book.querySelector('img'),250);
  if(phase!=='opening')return;
  const a=el.getBoundingClientRect();el.style.visibility='hidden';
  if(!reduce.matches){
    const an=flyTo(flyTransform(restRect,a),'none',FLY_MS);
    fadeTo(R.querySelector('.rd-bg'),1,300);chrome().forEach(e=>fadeTo(e,1,240,260));
    // the reader takes input as soon as the cover is close to its place
    await Promise.race([animDone(an,FLY_MS),new Promise(r=>later(r,FLY_MS*.45))]);
    if(phase!=='opening')return;
  }else{fly.style.transform='none';R.querySelector('.rd-bg').style.opacity=1;chrome().forEach(e=>e.style.opacity=1);}
  phase='open';R.querySelector('.rd-close').focus({preventScroll:true});
  while(pendingTurns>0){pendingTurns--;request(1);}
  const hi=new Image();hi.src=src(d,720);decoded(hi,3000).then(()=>{if(phase==='open'&&doc===d&&pages[0]!==hi.src){pages[0]=hi.src;const c=book.querySelector('.fb-pg[data-p="1"] img,.fb-sheet .f img');if(c)c.src=hi.src;}});
}
async function closeReader(){
  if(phase==='closed'||phase==='closing')return;
  phase='closing';drag=null;pendingTurns=0;
  const bg=R.querySelector('.rd-bg');
  chrome().forEach(e=>fadeTo(e,0,140));
  if(reduce.matches){finishNow();return;}
  // whatever is moving keeps moving, but toward "closed"
  if(S){S.target=0;}else if(mode==='sheet'&&sheetA!==0){startSheet(0);}
  if(mode==='book'){
    if(T&&T.a!==1){T.queue=0;T.target=T.p>.5?1:0;await new Promise(r=>{const w=()=>(!T||phase!=='closing')?r():requestAnimationFrame(w);w();});}
    if(phase!=='closing')return;
    if(T&&T.a===1){T.queue=0;T.target=0;}
    else if(pos!==1){startTurn(-1,0,1,pos);}
    // hand over to the flight as the fold lands
    await new Promise(r=>{const w=()=>(!T||T.p<.12||phase!=='closing')?r():requestAnimationFrame(w);w();});
    if(phase!=='closing')return;
  }
  const t=srcEl&&srcEl.isConnected?srcEl.getBoundingClientRect():null;
  const visible=t&&t.width&&t.bottom>0&&t.top<innerHeight;
  const cur=getComputedStyle(fly).transform;const from=cur&&cur!=='none'?cur:'none';
  fadeTo(bg,0,480);
  let an;
  if(visible){an=flyTo(from,flyTransform(restRect,t),620);}
  else{if(flyAnim)flyAnim.cancel();an=fly.animate([{opacity:1,transform:from},{opacity:0,transform:from+' scale(.96)'}],{duration:260,easing:'ease-in',fill:'forwards'});}
  await decoded(srcEl,200);
  await animDone(an,620);
  if(phase==='closing')finish();
}
function teardown(){
  if(flyAnim){flyAnim.cancel();flyAnim=null;}fly.getAnimations().forEach(a=>a.cancel());parkMeta();fly.querySelector('.fb-book')?.remove();fly.appendChild(meta);fly.style.transform='';fly.style.transformOrigin='';
  R.classList.remove('on');document.documentElement.classList.remove('rd-lock');
  [R.querySelector('.rd-bg'),...chrome()].forEach(e=>{e.getAnimations().forEach(a=>a.cancel());e.style.opacity=0;});
  cleanup.forEach(f=>f());cleanup=[];T=null;S=null;phase='closed';
}
function finish(){
  if(srcEl)srcEl.style.visibility='';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{if(phase!=='closing')return;teardown();
    if(lastFocus&&lastFocus.isConnected)lastFocus.focus({preventScroll:true});}));
}
function finishNow(){if(srcEl)srcEl.style.visibility='';teardown();}

// ── bending leaf ──
const STRIPS=()=>innerWidth<760?16:24;
function makeLeaf(frontI,backI,left,shF,shB){
  const S=STRIPS(),w=pw/S,lf=document.createElement('div');lf.className='lf';lf.style.left=left+'px';lf.style.transform='translateZ(48px)';
  const bg=(i,x)=>i>=1&&i<=N?`background-image:url('${PS(i)}');background-size:${pw}px ${ph}px;background-position:${x}px 0`:'';
  let parent=lf;const strips=[];
  for(let i=0;i<S;i++){const s=document.createElement('div');s.className='s';s.style.cssText=`left:${i?w:0}px;width:${w+.6}px`;
    // the spine shade is drawn across the strips as one gradient, page-wide, like on the flat pages
    const g=(on,dir,x)=>on&&i*w<pw*.13?`<i style="background:linear-gradient(to ${dir},rgba(var(--shc),.08),rgba(var(--shc),.025) ${pw*.048}px,transparent ${pw*.12}px) ${x}px 0/${pw}px 100% no-repeat"></i>`:'';
    s.innerHTML=`<b style="${bg(frontI,-i*w)}">${g(shF,'right',-i*w)}<u></u></b><b class="k" style="${bg(backI,-(pw-(i+1)*w))}">${g(shB,'left',-(pw-(i+1)*w))}<u></u></b>`;
    parent.appendChild(s);parent=s;strips.push(s);}
  // spine shading on the leaf itself, so it matches the pages around it
  const sh=document.createElement('div');
  const us=strips.map(s=>s.querySelectorAll(':scope>b>u'));
  return {el:lf,set(p,cd){ // p 0→1: the page lifts from the right and lays down on the left
    // cd is the direction the hand is moving (+1 towards the left, -1 back): the free edge always leads
    const bend=Math.sin(Math.PI*p)*.62;let prev=0;
    for(let i=0;i<S;i++){const x=(i+.5)/S,lead=bend*Math.pow(x,1.35)*(cd>=0?(1-p):p);
      const phi=-180*Math.max(0,Math.min(1,p+cd*lead));
      strips[i].style.transform=`rotateY(${(phi-prev).toFixed(2)}deg)`;prev=phi;
      const shade=Math.abs(Math.sin(phi*Math.PI/180));us[i][0].style.opacity=(shade*.14).toFixed(3);us[i][1].style.opacity=(shade*.11).toFixed(3);}
  }};
}
// a turn always runs "forward" from spread a to spread b; going back just plays it in reverse
function prepTurn(a,b){
  const va=spread(a),vb=spread(b),cast=document.createElement('div');cast.className='fb-cast';
  let leaf;
  if(two){setBookHTML(pgHTML(va[0],'l',true)+pgHTML(vb[1],'r',true));
    leaf=makeLeaf(va[1],vb[0],pw,ex(va[0]),ex(vb[1]));cast.style.left=pw+'px';
    book.style.setProperty('--shift','0px');
  }else{setBookHTML(pgHTML(vb[0],'c'));leaf=makeLeaf(va[0],0,0);}
  book.appendChild(cast);book.appendChild(leaf.el);
  return (p,cd=1)=>{leaf.set(p,cd);const lift=Math.sin(Math.PI*p);

    cast.style.opacity=lift.toFixed(3);cast.style.background=`linear-gradient(to right,rgba(var(--shc),${(.10*lift).toFixed(3)}),rgba(var(--shc),0) ${30+50*(1-p)}%)`;
    if(!two)leaf.el.style.opacity=p<.55?1:Math.max(0,1-(p-.55)/.4);};
}
// ── page turns: one controllable spring per turn, retargetable mid-flight ──
let T=null,S=null,raf=0;
const K=190,C=27;
Object.defineProperty(window,'turning',{get:()=>!!(T||S),configurable:true});
function startTurn(dir,v0=0,a,b){
  if(a===undefined){a=dir>0?pos:prevPos(pos);b=dir>0?nextPos(pos):pos;}
  T={a,b,set:prepTurn(a,b),p:dir>0?0:1,v:v0,target:dir>0?1:0,queue:0,cd:dir>0?1:-1};
  if(two)book.style.setProperty('--shift',shiftFor(dir>0?b:a)+'px');
  T.set(T.p);tickStart();
}
function startSheet(target){const sh=book.querySelector('.fb-sheet');S={a:sheetA,v:0,target:target??(sheetA===0?180:0),sh,us:sh.querySelectorAll('u')};tickStart();}
function tickStart(){if(!raf){let last=performance.now();const tick=t=>{const dt=Math.min(.032,(t-last)/1000);last=t;step(dt);raf=(T||S)?requestAnimationFrame(tick):0;};raf=requestAnimationFrame(tick);}}
function step(dt){
  if(T){for(let n=0;n<4;n++){const f=-K*(T.p-T.target)-C*T.v;T.v+=f*dt/4;T.p+=T.v*dt/4;}
    const want=T.target>T.p?1:-1;T.cd+=(want-T.cd)*Math.min(1,dt*9);
    const p=Math.max(0,Math.min(1,T.p));T.set(p,T.cd);
    const close=Math.abs(T.p-T.target)<(T.queue?.06:.0015)&&(T.queue||Math.abs(T.v)<.01);
    if(close){const fwd=T.target===1,q=T.queue,v=T.v;pos=fwd?T.b:T.a;T=null;draw();
      if(q>0&&phase==='open'){const dir=fwd?1:-1;if(!(dir>0&&atEnd(pos))&&!(dir<0&&pos<=1)){startTurn(dir,v*.6);T.queue=q-1;}}}}
  if(S){for(let n=0;n<4;n++){const f=-K*.8*(S.a-S.target)-C*.85*S.v;S.v+=f*dt/4;S.a+=S.v*dt/4;}
    const t=Math.abs(Math.sin(S.a*Math.PI/180));
    S.sh.style.transform=`translateZ(${(t*70).toFixed(1)}px) rotateY(${S.a.toFixed(2)}deg) rotateZ(${(t*-1.2).toFixed(2)}deg)`;
    S.us.forEach(u=>u.style.opacity=(t*.12).toFixed(3));
    if(Math.abs(S.a-S.target)<.2&&Math.abs(S.v)<.5){sheetA=S.target;S.sh.style.transform=`rotateY(${sheetA}deg)`;S=null;}}
  syncMetaUnderLeaf();
}
// a request during a turn: same direction queues the next page, the other direction reverses at once
function request(dir){
  if(phase==='opening'){if(dir>0)pendingTurns++;return;}
  if(phase!=='open')return;
  if(mode==='sheet'){if(S){S.target=S.target===0?180:0;}else startSheet();return;}
  if(reduce.matches){if(dir>0&&!atEnd(pos))pos=nextPos(pos);else if(dir<0&&pos>1)pos=prevPos(pos);draw();return;}
  if(!T){if(dir>0&&atEnd(pos))return;if(dir<0&&pos<=1)return;startTurn(dir);return;}
  const fwd=T.target===1;

const turn=request;

// ── input ──
let drag=null;
stage.addEventListener('pointerdown',e=>{if(e.button>0||phase==='closed')return;
  const onDoc=!!e.target.closest('.fb-book');
  if(!onDoc){closeReader();return;}            // outside the document: close straight away
  drag={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId,p:0,v:0,live:false,cd:1};});
stage.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||phase!=='open')return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.live){if(Math.abs(dx)<8||Math.abs(dx)<Math.abs(dy)||T||S)return;const dir=dx<0?1:-1;
    if(mode==='sheet'){drag.sheet=true;drag.a0=sheetA;}
    else{if((dir>0&&atEnd(pos))||(dir<0&&pos<=1)||reduce.matches){drag=null;return;}
      drag.dir=dir;drag.cd=dir;drag.a=dir>0?pos:prevPos(pos);drag.b=dir>0?nextPos(pos):pos;drag.set=prepTurn(drag.a,drag.b);
      if(two)book.style.setProperty('--shift',shiftFor(dir>0?drag.b:drag.a)+'px');}
    drag.live=true;stage.setPointerCapture(e.pointerId);}
  const now=performance.now(),w=(two?pw*2:pw)*.85;
  if(drag.sheet){const k=Math.max(0,Math.min(1,Math.abs(dx)/(pw*.9)));drag.ang=drag.a0+(drag.a0===0?180:-180)*k;
    book.querySelector('.fb-sheet').style.transform=`translateZ(${Math.abs(Math.sin(drag.ang*Math.PI/180))*70}px) rotateY(${drag.ang}deg)`;}
  else{const p=drag.dir>0?Math.max(0,Math.min(1,-dx/w)):Math.max(0,Math.min(1,1-dx/w));drag.v=(p-drag.p)/Math.max(1,now-drag.t)*1000;drag.p=p;
    if(Math.abs(drag.v)>.15)drag.cd+=((drag.v>0?1:-1)-drag.cd)*.35; // the curl follows the hand
    drag.set(p,drag.cd);syncMetaUnderLeaf();}
  drag.t=now;});
const endDrag=e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;
  if(!d.live){ // a tap: act immediately
    if(mode==='sheet'||pos===1){request(1);return;}
    const r=visibleRect();request(e.clientX<r.left+r.width/2?-1:1);return;}
  if(d.sheet){sheetA=d.a0;const sh=book.querySelector('.fb-sheet');S={a:d.ang,v:0,target:Math.abs(d.ang-d.a0)>60?(d.a0===0?180:0):d.a0,sh,us:sh.querySelectorAll('u')};tickStart();return;}
  const target=Math.abs(d.v)>1.2?(d.v<0?0:1):(d.p>.5?1:0);
  T={a:d.a,b:d.b,set:d.set,p:d.p,v:d.v,target,queue:0,cd:d.cd};tickStart();syncMetaUnderLeaf();};
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
R.querySelector('.rd-close').addEventListener('pointerdown',e=>{e.preventDefault();closeReader();});
R.querySelector('.rd-close').onclick=closeReader;
document.addEventListener('keydown',e=>{if(phase==='closed')return;
  if(e.key==='Escape'){e.preventDefault();closeReader();}
  if(e.key==='ArrowRight'){e.preventDefault();request(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();request(-1);}
  if(e.key!=='Tab')return;
  const els=[...R.querySelectorAll('button:not([disabled]),a[href]')].filter(el=>el.offsetParent!==null);
  if(els.length<2)return;
  const i=els.indexOf(document.activeElement);
  e.preventDefault();
  const n=e.shiftKey?(i<=0?els.length-1:i-1):(i===els.length-1||i<0?0:i+1);
  els[n].focus();});
addEventListener('resize',()=>{if(phase==='open'&&!T&&!S)layout();});


Promise.all([fetch('/data/documents.json').then(r=>r.json()),fetch('/flip/manifest.json').then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,f])=>{
  DOCS=d;FLIP=f;
  const want=new URLSearchParams(location.search).get('dok');
  const flipDocs=DOCS.filter(x=>FLIP[x.id]);
  const start=DOCS.find(x=>x.id===want)||(flipDocs.length?flipDocs[Math.floor(Math.random()*flipDocs.length)]:pick());
  feature(start);years();reset();
  if(want&&start.id===want)requestAnimationFrame(()=>openReader(start,document.querySelector('#fOpen img')));
});
