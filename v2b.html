<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Trond Worren</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="/lib/sanitize.js"></script><script src="/shell.js"></script><script src="/v2.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafaf9;color:#1c1c1c;font-family:'Noto Sans',sans-serif}
a{color:inherit;text-decoration:none}.serif{font-family:'Noto Serif',Georgia,serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 56px}
header{display:flex;justify-content:space-between;align-items:baseline;padding:40px 0;border-bottom:1px solid #e7e5e4}
.brand .name{font-family:'Noto Serif',serif;font-size:1.75rem}.brand .tag{color:#78716c;font-size:.95rem;margin-left:14px}
nav{display:flex;gap:8px}nav a{font-size:.95rem;padding:8px 14px;border-radius:6px;color:#44403c}nav a:hover{background:#f0efed}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:72px;padding:72px 0}
.feat .date,.item .date{font-size:.9rem;color:#78716c}
.feat h2{font-family:'Noto Serif',serif;font-weight:400;font-size:clamp(2.25rem,4vw,3.5rem);line-height:1.12;margin:16px 0 28px}
.feat h2 a:hover,.item h3 a:hover{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.feat .text{font-family:'Noto Serif',serif;font-size:1.25rem;line-height:1.75;color:#3a3a3a;max-width:34em}
.btn{display:inline-flex;align-items:center;height:42px;padding:0 18px;border-radius:6px;background:#1c1c1c;color:#fafaf9;font-size:.95rem;font-weight:600;margin-top:28px}
.btn:hover{background:#3f3f46}.btn.out{background:transparent;color:#1c1c1c;border:1px solid #d6d3d1}.btn.out:hover{background:#f0efed}
.side{border-left:1px solid #e7e5e4;padding-left:48px}
.side h4{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:#a8a29e;font-weight:600;margin:0 0 8px}
.item{padding:24px 0;border-bottom:1px solid #eeecea}.item h3{font-family:'Noto Serif',serif;font-weight:400;font-size:1.375rem;line-height:1.3;margin:6px 0 8px}
.item p{font-size:.95rem;line-height:1.6;color:#57534e;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{border-top:1px solid #e7e5e4;padding:56px 0 96px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.foot .serif{font-size:1.5rem}.foot p{color:#78716c;margin:6px 0 0}
.post{max-width:760px;margin:0 auto;padding:72px 0 96px}.post h1{font-family:'Noto Serif',serif;font-weight:400;font-size:clamp(2.25rem,4vw,3.25rem);line-height:1.15;margin:12px 0 36px}
.post .text{font-family:'Noto Serif',serif;font-size:1.2rem;line-height:1.8}.post .text p{margin:0 0 1.2em}
.back{font-size:.95rem;color:#57534e}
.sample{display:inline-block;font-size:.85rem;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:999px;padding:2px 10px;margin-bottom:8px}
.empty{padding:72px 0;color:#78716c}
@media(max-width:860px){.wrap{padding:0 22px}header{flex-direction:column;gap:12px;padding:28px 0}.brand .tag{display:block;margin:4px 0 0}nav{margin-left:-14px}.grid{grid-template-columns:1fr;gap:40px;padding:40px 0}.side{border-left:0;padding-left:0;border-top:1px solid #e7e5e4;padding-top:32px}.post{padding:40px 0 64px}}
</style></head><body><div class="wrap">
<header><a class="brand" href="/v2b"><span class="name">Trond Worren</span><span class="tag">Tidligere tigger, uteligger.</span></a>
<nav><a href="/v2b">Forside</a><a href="/arkiv">Arkiv</a></nav></header>
<main id="root"></main></div>
<script>
twV2({
  list: ([f, ...rest]) => `<div class="grid"><article class="feat">${twSample(f)}<div class="date">${TW.date(f.d)}</div>
      <h2><a href="${twLink(f)}">${TW.esc(f.t)}</a></h2><div class="text">${TW.esc(TW.preview(f.x, 460))}</div>
      <a class="btn" href="${twLink(f)}">Les hele innlegget</a></article>
    <aside class="side"><h4>Tidligere</h4>${rest.map((p) => `<article class="item"><div class="date">${TW.date(p.d)}</div>
      <h3><a href="${twLink(p)}">${TW.esc(p.t)}</a></h3><p>${TW.esc(TW.preview(p.x, 160))}</p></article>`).join('')}</aside></div>
    <section class="foot"><div><div class="serif">Arkivet</div><p>4 486 innlegg og håndskrevne dagbøker fra 2016–2022.</p></div><a class="btn out" href="/arkiv">Gå til arkivet →</a></section>`,
  post: (p) => `<article class="post"><a class="back" href="/v2b">← Tilbake til forsiden</a><div style="margin-top:40px">${twSample(p)}</div>
    <div class="date" style="color:#78716c;font-size:.95rem">${TW.date(p.d)}</div><h1>${TW.esc(p.t)}</h1><div class="text">${TW.paras(p.x)}</div>
    <a class="btn out" href="/v2b">← Tilbake til forsiden</a></article>`
});
</script></body></html>
