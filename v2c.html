<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Trond Worren</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="/lib/sanitize.js"></script><script src="/shell.js"></script><script src="/v2.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f1e7;color:#2b2723;font-family:'Noto Serif',Georgia,serif}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 28px}
header{text-align:center;padding:88px 0 56px}
.name{font-size:2rem;font-style:italic;text-decoration:none}
.tag{font-family:'Noto Sans',sans-serif;font-size:.95rem;color:#8a7f72;margin:10px 0 0}
nav{margin-top:24px;font-family:'Noto Sans',sans-serif;font-size:.9rem;display:flex;justify-content:center;gap:24px}
nav a{text-decoration:none;color:#6b6157}nav a:hover{color:#2b2723}
.rule{width:48px;height:1px;background:#cfc4b4;margin:0 auto}
.letter{padding:64px 0;border-bottom:1px solid #e4dccd;text-align:left}
.date{font-family:'Noto Sans',sans-serif;font-size:.9rem;color:#8a7f72;letter-spacing:.02em;margin-bottom:14px}
.title{font-size:1.75rem;font-weight:400;line-height:1.3;margin:0 0 20px}.title a{text-decoration:none}.title a:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.text{font-size:1.15rem;line-height:1.85}.text p{margin:0 0 1.2em}
.more{font-style:italic;color:#6b6157;text-underline-offset:4px}
.arch{text-align:center;padding:72px 0 120px}.arch a{font-style:italic;font-size:1.3rem;text-underline-offset:5px}
.arch p{font-family:'Noto Sans',sans-serif;font-size:.9rem;color:#8a7f72;margin:10px 0 0}
.sign{font-style:italic;color:#6b6157;margin-top:32px}
.back{font-family:'Noto Sans',sans-serif;font-size:.9rem;color:#6b6157;text-decoration:none}
.sample{display:inline-block;font-family:'Noto Sans',sans-serif;font-size:.85rem;color:#9a3412;border:1px solid #e9b98f;border-radius:999px;padding:2px 10px;margin-bottom:14px}
.empty{text-align:center;padding:64px 0;color:#8a7f72}
@media(max-width:600px){header{padding:56px 0 40px}.letter{padding:44px 0}.title{font-size:1.45rem}.text{font-size:1.0625rem}}
</style></head><body><div class="wrap">
<header><a class="name" href="/v2c">Trond Worren</a><p class="tag">Tidligere tigger, uteligger.</p>
<nav><a href="/v2c">Forside</a><a href="/arkiv">Arkiv</a></nav></header>
<div class="rule"></div><main id="root"></main></div>
<script>
twV2({
  list: (ps) => ps.map((p) => `<article class="letter">${twSample(p)}<div class="date">${TW.date(p.d)}</div>
    <h2 class="title"><a href="${twLink(p)}">${TW.esc(p.t)}</a></h2><div class="text"><p>${TW.esc(TW.preview(p.x, 340))}</p></div>
    <a class="more" href="${twLink(p)}">Les hele brevet</a></article>`).join('')
    + `<section class="arch"><a href="/arkiv">Gå til arkivet</a><p>4 486 innlegg og dagbøker, 2016–2022</p></section>`,
  post: (p) => `<article class="letter" style="border:0;padding-top:48px"><a class="back" href="/v2c">← Tilbake til forsiden</a>
    <div style="height:40px"></div>${twSample(p)}<div class="date">${TW.date(p.d)}</div><h1 class="title">${TW.esc(p.t)}</h1>
    <div class="text">${TW.paras(p.x)}</div><p class="sign">— Trond</p>
    <p style="margin-top:48px"><a class="back" href="/v2c">← Tilbake til forsiden</a></p></article>`
});
</script></body></html>
